#
# Configuration for the FMCW SIMO *dense* angle-then-cluster demo. The beam grid
# is deliberately modest: the dense path forms the full RDA cube
# (num_az x num_el x num_doppler x num_range), so a fine grid over a full RD map
# is memory-heavy (see PhaseShiftBeamformerOp OPEN_ITEMS). 13 x 13 beams over a
# 128 x 256 RD map is a few tens of MB in complex64.

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  chirp_repetition_interval: 25.0e-6

range_processor:
  waveform: *waveform
  range_window: hann

clutter_filter:
  method: mean_subtraction

doppler_processor:
  waveform: *waveform
  doppler_window: hann

# Dense angle path: form an az x el beam for every RD cell -> RDA cube. The
# Taylor aperture taper suppresses spatial sidelobes so a strong target does not
# fire CFAR across every beam (untapered ULA sidelobes are only ~-13 dB).
phase_shift_beamformer:
  angle_convention:
    preset: radar_boresight
  az_coordinates: [-0.3, -0.25, -0.2, -0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15, 0.2,
    0.25, 0.3]
  el_coordinates: [-0.3, -0.25, -0.2, -0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15, 0.2,
    0.25, 0.3]
  array_taper:
    type: taylor
    sidelobe_attenuation_db: 35.0

# CFAR runs on the RDA cube: nci_axes = [] leaves the (az, el) axes as batch
# slices, so detection_idx widens to (az_bin, el_bin, doppler_bin, range_bin).
cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  # Peak-grouping (non-maximum suppression), applied per-beam on the RDA cube
  # (AnglePeakPickOp still does the cross-beam collapse). A native CFAR param;
  # the app also reads this key (a read-only mirror of this block) to drop the
  # DBSCAN clustering + reduction stages and report the cube peaks directly.
  peak_mode: none
  nci_axes: []

cluster_dbscan:
  epsilon: [3.0, 2.0, 0.3, 0.3]
  min_points: 3
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5, 20.0, 20.0]

cube:
  num_chirps: 128
  samples_per_chirp: 256

# Run cadence. The source emits `num_frames` cubes, one every `frame_period`
# seconds, advancing the targets through space between frames.
# meter_cadence — log WARN when source inter-emit or DenseClusterReport e2e
#   exceeds frame_period (+ max(10 ms, 10% of period) slack); print a summary at exit (default true).
# meter_log_every — also INFO e2e every N sink frames (0 = warn/summary only).
run:
  num_frames: 250
  frame_period: 0.1
  meter_cadence: true
  meter_log_every: 0

# Optional Holoviz display: RD map (channel-0 slice) with cluster-colored
# detection dots, plus rolling range/velocity plots and a boresight az/el
# scatter. Set visualization.enabled: false for a headless log-only run. If no
# display is reachable the app auto-falls back to headless (unless
# skip_display_check is true); headless: true renders offscreen without a window.
#   marker_radius / marker_outline — dot + outline radius, fractions of the RD
#     image extent; marker_segments (>= 3) sets dot roundness.
visualization:
  enabled: true
  marker_radius: 0.004
  marker_outline: 0.002
  marker_segments: 20
  # vsync: true forces a FIFO present mode (frame-rate capped) — far more
  # robust to window-resize swap-chain errors than IMMEDIATE. Set false for
  # uncapped / low-latency rendering, at the cost of resize robustness (and
  # possible tearing).
  vsync: true
headless: false
skip_display_check: false

plots:
  enable: true
  window: 120

# RX URA (uniform rectangular array) in the y-z plane, matching fmcw_simo.
rx_array:
  az_elements: 8
  el_elements: 8
  spacing: 0.5

# Position = range * dir(az, el). Four of the five targets carry a transverse
# velocity component (0.32-0.46 m/s) on top of the radial one, so their az/el
# sweep over the run; target 3 is the one purely radial reference. The
# transverse motion is small next to the ranges here, so each target's radial
# rate drifts by under 0.2 Doppler bins and the two close passes still coincide
# in range and Doppler. See the README for the scene.
targets:
  - { range: 245.0,  azimuth: 0.15,  elevation: 0.10,  velocity: [-6.3375, -1.4129, -0.5494], amplitude: 0.8 }
  - { range: 132.0,  azimuth: -0.10, elevation: -0.12, velocity: [1.5025, -0.3015, 0.1183],   amplitude: 0.6 }
  - { range: 22.0,   azimuth: 0.0,   elevation: 0.08,  velocity: [8.9712, 0.0, 0.7192],       amplitude: 0.7 }
  - { range: 117.0,  azimuth: 0.20,  elevation: 0.10,  velocity: [2.9310, 0.7166, 0.0010],    amplitude: 0.55 }
  - { range: 218.0,  azimuth: 0.17,  elevation: 0.04,  velocity: [-4.8577, -1.2600, -0.0800], amplitude: 0.7 }

noise_snr_db: -28.0
