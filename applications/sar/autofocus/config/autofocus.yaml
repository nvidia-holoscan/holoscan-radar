#
# WORKFLOWS Figure 2 on Kourou / Guiana Space Centre -- the PGA
# vehicle, picked because it meets PGA's scene preconditions: a
# stationary hard target, isolated 135x over its annulus, that stays
# lit across the whole dwell (worst of 8 dwell blocks holds 0.68 of
# its mean). Selected with tools/sar_autofocus/pga_screen.py, which
# re-measures those two numbers on demand. Screening picked this
# collect, but it does not make it the best of the four: Atlanta and
# Houston both score higher on the same screen (see the app README).
# The whole snapshot is retained (~23.4k profiles) so it can be
# replayed once, corrected.
#
# Download once (4.19 GiB), then form. The app never reaches the
# network. Paths resolve under the build data directory (default:
# data/).
#
#   mkdir -p data/sar
#   curl -L -o data/sar/2023-06-24-13-22-56_UMBRA-05_CPHD.cphd \
#     https://umbra-open-data-catalog.s3.us-west-2.amazonaws.com/sar-data/task-data/1378d9a4-8eb3-4d5c-96ce-15797a5a8d27/2023-06-24-13-22-56_UMBRA-05/2023-06-24-13-22-56_UMBRA-05_CPHD.cphd
#
# On this clean collect autofocus should do no harm: the scene is
# already focused, so a correct estimator returns essentially zero.
# Injecting a known phase error to correct is the position_error
# diagnostic.

cphd:
  path: sar/2023-06-24-13-22-56_UMBRA-05_CPHD.cphd
  names:
    - Kourou
  sidecar: ""

# dump: true writes a .npy (off by default).

# 0.25 m, not 1 m: this target is diffraction-limited to 1-2 samples
# at 0.25 m, so a 1 m lattice scallops -- the sampled peak rises when
# the PSF is broadened, and the peak stops measuring focus at all.
sample_geometry:
  origin: [3841933.189411493, -5058154.964524482, 577176.8448190973]
  axis_v: [0.05516103300897359, -0.07258334219257478, -0.9958357891106036]
  axis_u: [0.7961743851579871, 0.6050672263627416, 0.0]
  spacing: [0.25, 0.25]
  counts: [2048, 2048]

# Stored sample N/2 = SC0 + (N/2)*SCSS, the IFFT DC after range
# compression's ifftshift. N must come from Data/Channel: a CPHD
# header carries other NumSamples elements and the wrong one
# mis-derives this by tens of MHz, which is a phase ramp that
# defocuses everything and looks like a bad scene rather than a bug.
reference_frequency: 9.599952868e9

cphd_reader:
  coordinate_frame: ecef
  pulses_per_tick: 1024

# Figure 2 needs a retained aperture: an emit-and-reset spotlight has
# nothing left to replay once the estimate exists.
aperture_manager:
  max_aperture_pulses: 23375
  emit_interval_pulses: 0
  emit_mode: reform

range_compression:
  propagation_speed: 299792458.0

backprojection:
  coordinate_frame: ecef

autofocus:
  azimuth_axis: u
  # 16 is the contract default. 718 range bins pass the gate here,
  # and min_scatterers doubles as the cap on how many are kept, so a
  # low floor throws away the averaging. Measured across 4/16/64/256
  # it barely moves the result, so this is the default rather than a
  # tuned value.
  min_scatterers: 16
  # The app would otherwise default this to 64/n_u ~ 0.0027, sized
  # for a much narrower aux. Swept 64/256/1024/4096/11688 samples:
  # 1024 recovers an injected quadratic almost exactly, 4096 gives
  # the best peak, and 11688 is all clutter and collapses to a
  # pass-through.
  window_fraction: 0.0438

phase_correction:
  sense: subtract

# Range-bearing (polar) aux, anchored on the product lattice centre.
# num_v is left out so the rows are auto-sized to the product's own
# slant-range span; the app logs where the product's centre and
# corners land on the aux and warns if they do not fit.
aux_lattice:
  mode: polar

# Uncomment to inject a known 2 cm look-axis quadratic and score the
# estimate against it, instead of only looking at the image. Add
# `oracle: true` to skip the estimator and apply the exact leftover,
# which separates a correction-path fault from an estimator one.
# position_error:
#   axis: look
#   polynomial: [0, 0, 0.02]
#   score_warn_rms_rad: 1.0

visualize: false
