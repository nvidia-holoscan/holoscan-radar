#
# Mode-4 demo: continuous strip of Imperial Valley Capella
# stripmap (INPUT_DATA.md). Same collect as mode 3; mode 4
# translates the lattice along v and scrolls the accumulator
# (no tile seams, no cross-range taper). Pull first (~3.45 GiB);
# the app never reaches the network.
#
#   python3 tools/sar_data/pull_cphd.py --app continuous_strip \
#     --dest data/sar/imperial
#   Paths below resolve under the build data directory (default: data/).
#
# Lattice follows the SRP chord (not the IARP tangent plane).
# lattice.max_side is the scrolling window depth along v, not a
# coarsening cap; parent u is the IFFT swath at native GSD.
# Geometry goes to BackprojectionOp (geometry_change: scroll);
# the manager is cadence only (emit_and_continue, no weight).
# pulses_per_tick 1024 (reader batch). emit_interval 256:
# the graph driver gives the stager that slice size, so one
# reader cube becomes four manager/BP ticks (window from each
# slice's last SRP). 159050 / 1024 leaves a 330-pulse final
# reader batch (256+74 after slicing). playback_rate 1 paces to collect time.
# nfft_pad: next_fast. loop continues until the process is stopped; wrap restages
# the opening window with emit-and-reset. Holoviz is the parent
# strip (same landscape fit as mode 3), not the scrolling chip:
# SarMosaicOp blits each window into the parent. Holoviz
# currently shows the full parent union. The planned u-axis
# crop is not wired; dump also writes the full union.
# Holoviz transposes only the display axes: along-track v is
# horizontal, so the long strip fits a landscape window.
# visualize_size caps that long display axis in pixels.

cphd:
  path: sar/imperial/CAPELLA_C14_SM_CPHD_VV_20241129025546_20241129025602.cphd
  names:
    - Imperial Valley
  sidecar: ""

lattice:
  scroll: true
  max_side: 4096

cphd_reader:
  coordinate_frame: ecef
  pulse_range: [0, 159050]
  pulses_per_tick: 1024
  loop: true
  playback_rate: 1
  duty_cycle: 1
  wait_for_downstream: true

nfft_pad: next_fast

aperture_manager:
  max_aperture_pulses: 0
  emit_interval_pulses: 256
  emit_mode: continue

range_compression:
  range_window: taylor

backprojection:
  coordinate_frame: ecef
  geometry_change: scroll

visualize: true
visualize_size: 1400
skip_display_check: false
headless: false
visualize_hold_s: -1
