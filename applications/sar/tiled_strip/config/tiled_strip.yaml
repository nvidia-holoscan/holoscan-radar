#
# Tiled strip demo: tiled strip of Imperial Valley Capella stripmap
# (INPUT_DATA.md). Same collect as continuous strip; tiled strip steps geometry
# and resets (seams), a parent mosaic holds finished squares so
# Holoviz is the strip, not the last chip. Pull first (~3.45 GiB);
# the app never reaches the network.
#
#   uv run applications/sar/tools/pull_cphd.py --app tiled_strip \
#     --dest data/sar
#   Paths below resolve under the build data directory (default: data/).
#
# nvec 159051 does not divide by 10; pulse_range drops the last
# vector so ten tiles of 15905 pulses (~10.4 km along-track).
# Lattice follows the SRP chord (not the IARP tangent plane).
# Parent u is every ground point the pulses can light; every
# tile forms that full height so joins line up. lattice.max_side
# caps each tile's along-track axis. Parent v is ten tiles
# along-track; parent u can exceed max_side.
# Block aperture: max_aperture_pulses 0 with
# emit_interval = tile length is the stamped-window row
# (aperture_window is illegal when max > 0). Taylor on range and
# azimuth; weight wired. pulses_per_tick 3181 divides the tile
# (five ticks). playback_rate 1 paces to collect time (~1.6 s per tile).
# nfft_pad: next_fast. The loop repeats until stopped; wrap
# restages tile 0 and clears the mosaic. A display u-crop was
# planned but is not wired; Holoviz and dump show the full
# parent union. The display puts along-track v horizontally;
# formation and dump keep (v,u). visualize_size bounds the raster.

cphd:
  path: sar/CAPELLA_C14_SM_CPHD_VV_20241129025546_20241129025602.cphd
  names:
    - Imperial Valley
  sidecar: ""

lattice:
  tiles: 10
  max_side: 4096

cphd_reader:
  coordinate_frame: ecef
  pulse_range: [0, 159050]
  pulses_per_tick: 3181
  loop: true
  playback_rate: 1
  duty_cycle: 1

nfft_pad: next_fast

aperture_manager:
  max_aperture_pulses: 0
  emit_interval_pulses: 15905
  emit_mode: reset
  aperture_window: taylor

range_compression:
  range_window: taylor

backprojection:
  coordinate_frame: ecef

app:
  visualization:
    enabled: true
    max_side: 1400
    skip_display_check: false
    headless: false
    final_image_hold_s: -1
