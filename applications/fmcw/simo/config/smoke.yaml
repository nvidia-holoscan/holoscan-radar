app:
    waveform: &waveform
        carrier_frequency: 77.0e9
        bandwidth: 150.0e6
        chirp_duration: 20.0e-6
        sample_rate: 12.8e6
        chirp_repetition_interval: 25.0e-6
    cube:
        num_chirps: 64
        samples_per_chirp: 256
    run:
        num_frames: 5
        frame_period: 0.1
        meter_cadence: true
        meter_log_every: 0
    visualization:
        enabled: false
        window_width: 1280
        window_height: 720
        window_title: FMCW SIMO smoke
        display_rate_hz: 10.0
        dynamic_range_db: 60.0
        detection_radius: 0.010
        history_frames: 120
    rx_array:
        az_elements: 4
        el_elements: 4
        spacing: 0.5
    targets:
        - range: 245.0
          azimuth: 0.15
          elevation: 0.09
          velocity:
              - -6.3375  # x
              - -1.4129  # y
              - -0.5494  # z
          amplitude: 0.8
    noise_snr_db: 5.0

range_processor:
    waveform: *waveform
    # Common options: none, hann, hamming.
    # See ../../../../operators/fmcw/fmcw_range_processor_op/README.md.
    range_window: hann
clutter_filter:
    # Options: none, mean_subtraction, single_delay, double_delay.
    method: none
doppler_processor:
    waveform: *waveform
    # Common options: none, hann, hamming.
    # See ../../../../operators/fmcw/fmcw_doppler_processor_op/README.md.
    doppler_window: hann

detect_then_beamform:
    cfar_detector:
        # Options: CA, GO, SO, OS.
        cfar_variant: CA
        guard_cells:
            - 3  # Doppler
            - 3  # Range
        training_cells:
            - 3  # Doppler
            - 3  # Range
        pfa: 1.0e-9
        nci_axes:
            - 0  # RX channel
    snapshot_gather:
        snapshot_window:
            - 0  # Doppler
            - 0  # Range
    beamscan_estimator:
        angle_convention:
            # Common options: radar_boresight, direction_cosine, custom.
            # See ../../../../operators/angle_estimation/beamscan_estimator_op/README.md.
            preset: radar_boresight
        az_angles:
            - -0.3
            - -0.15
            - 0.0
            - 0.15
            - 0.3
        el_angles:
            - -0.3
            - -0.15
            - 0.0
            - 0.15
            - 0.3
        # Options: none, parabolic.
        peak_interpolation: parabolic
    feature_assembly:
        # Common options: range, velocity, score.
        # See ../../../../operators/detection/feature_assembly_op/README.md.
        features:
            - range
            - velocity
            - az_estimate
            - el_estimate
            - score
            - range_bin
            - doppler_bin
    cluster_dbscan:
        epsilon:
            - 0.0  # Range
            - 0.0  # Velocity
            - 0.0  # Azimuth estimate
            - 0.0  # Elevation estimate
            - 0.0  # Score
            - 1.5  # Range bin
            - 1.5  # Doppler bin
        min_points: 1
        max_clusters: 16
    reduction:
        # Options: peak, medoid, first, weighted_mean.
        representative: weighted_mean
        # Options: weighted_sum, weighted_l2, weighted_max, custom.
        score_method: weighted_sum
        feature_weights:
            - 0.0  # Range
            - 0.0  # Velocity
            - 0.0  # Azimuth estimate
            - 0.0  # Elevation estimate
            - 1.0  # Score
            - 0.0  # Range bin
            - 0.0  # Doppler bin

beamform_then_detect:
    phase_shift_beamformer:
        angle_convention:
            # Common options: radar_boresight, direction_cosine, custom.
            # See ../../../../operators/angle_estimation/phase_shift_beamformer_op/README.md.
            preset: radar_boresight
        az_angles:
            - -0.3
            - -0.15
            - 0.0
            - 0.15
            - 0.3
        el_angles:
            - -0.3
            - -0.15
            - 0.0
            - 0.15
            - 0.3
        array_taper:
            # Common options: none, hann, taylor.
            # See ../../../../operators/angle_estimation/phase_shift_beamformer_op/README.md.
            type: taylor
            sidelobe_attenuation_db: 35.0
    cfar_detector:
        # Options: CA, GO, SO, OS.
        cfar_variant: CA
        guard_cells:
            - 3  # Doppler
            - 3  # Range
        training_cells:
            - 3  # Doppler
            - 3  # Range
        pfa: 1.0e-9
        # Options: none, range_doppler, all.
        peak_mode: all
        peak_radius:
            - 2  # Azimuth
            - 2  # Elevation
            - 2  # Doppler
            - 2  # Range
        nci_axes: []
    feature_assembly:
        # Common options: range, velocity, score.
        # See ../../../../operators/detection/feature_assembly_op/README.md.
        features:
            - range
            - velocity
            - az
            - el
            - score
            - range_bin
            - doppler_bin
            - az_bin
            - el_bin
