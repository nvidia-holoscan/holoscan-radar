# Exercise the same dense beamforming graph and dashboard on a smaller cube.
# Full-demo detection/feature pool bounds can exceed CI GPU memory.
extends: dense_beamforming.yaml
app:
    cube:
        num_chirps: 16
phase_shift_beamformer:
    az_coordinates: {min: -0.3, max: 0.3, step: 0.15}
    el_coordinates: {min: -0.3, max: 0.3, step: 0.15}
