app:
    aoa_algorithm: music
    waveform: &waveform
        carrier_frequency: 77.0e9
        bandwidth: 150.0e6
        chirp_duration: 10.0e-6
        sample_rate: 6.4e6
        chirp_repetition_interval: 50.0e-6
    cube: {num_chirps: 16, samples_per_chirp: 64}
    run: {num_frames: 2, frame_period: 0.02, meter_cadence: false}
    visualization:
        enabled: false
        window_width: 640
        window_height: 360
        window_title: FMCW Adaptive AoA Smoke
        display_rate_hz: 20.0
        dynamic_range_db: 60.0
        detection_radius: 0.01
        history_frames: 2
        detection_trail_frames: 2
    tx_array: {num_tx: 2, spacing: 2.0}
    rx_array: {az_elements: 4, el_elements: 4, spacing: 0.5}
    tdm:
        physical_chirp_repetition_interval: 25.0e-6
        tx_order: [0, 1]
    scene_visibility: {model: front_half_space, boresight_direction: [1.0, 0.0, 0.0]}
    targets:
        - {range: 22.0, azimuth: -0.10, elevation: 0.0, velocity: [-2.0, 0.2, 0.0], amplitude: 1.0}
        - {range: 22.0, azimuth: 0.10, elevation: 0.0, velocity: [-2.0, -0.2, 0.0], amplitude: 1.0}
        - {range: 28.0, azimuth: 0.25, elevation: 0.0, velocity: [1.0, 0.25, 0.0], amplitude: 0.8}
    noise_snr_db: 24.0

mimo_deinterleave: {}
range_processor: {waveform: *waveform, range_window: hann}
clutter_filter: {method: mean_subtraction, doppler_window: hann}
doppler_processor: {waveform: *waveform, doppler_window: hann}
tdm_sparse_compensation:
    overlap_policy: dedup
    snapshot_window: [1, 1]
    doppler_edge: wrap
    range_edge: shift
cfar_detector:
    cfar_variant: CA
    guard_cells: [1, 1]
    training_cells: [2, 2]
    pfa: 1.0e-5
    peak_mode: range_doppler
    nci_axes: [0, 1]
beamscan_estimator:
    angle_convention: &angle_convention {preset: radar_boresight}
    az_coordinates: {min: -0.5, max: 0.5, step: 0.05}
    el_coordinates: {min: -0.2, max: 0.2, step: 0.05}
    peak_interpolation: parabolic
rank_one_residual_screen:
    angle_convention: *angle_convention
    residual_threshold: 0.03
music_estimator:
    angle_convention: *angle_convention
    az_coordinates: {min: -0.4, max: 0.4, step: 0.02}
    el_coordinates: {min: -0.2, max: 0.2, step: 0.02}
    num_sources: -1
    max_sources: 2
    spatial_smoothing: [2, 1]
    forward_backward: true
root_music_estimator: {angle_convention: *angle_convention, num_sources: -1, max_sources: 2, spatial_smoothing: [2, 1], forward_backward: true}
esprit_estimator: {angle_convention: *angle_convention, num_sources: -1, max_sources: 2, spatial_smoothing: [2, 1], forward_backward: true}
mvdr_estimator:
    angle_convention: *angle_convention
    az_coordinates: {min: -0.4, max: 0.4, step: 0.02}
    el_coordinates: {min: -0.2, max: 0.2, step: 0.02}
    max_sources: 2
    spatial_smoothing: [2, 1]
    forward_backward: true
feature_assembly:
    features: [range, velocity, az_estimate, el_estimate, score]
