app:
    waveform: &waveform
        carrier_frequency: 77.0e9
        bandwidth: 150.0e6
        chirp_duration: 20.0e-6
        sample_rate: 12.8e6
        chirp_repetition_interval: 25.0e-6
    cube:
        num_chirps: 128
        samples_per_chirp: 256
    run:
        num_frames: 2
        frame_period: 0.1
        meter_cadence: true
        meter_log_every: 0
    visualization:
        enabled: false
        window_width: 1280
        window_height: 720
        window_title: FMCW SISO
        display_rate_hz: 20.0
        dynamic_range_db: 60.0
        detection_radius: 0.010
        history_frames: 120
        detection_trail_frames: 50
    # Baseline SIMO targets projected onto the SISO radial axis.
    targets:
        - {range: 245.0, velocity: -6.5006, amplitude: 0.8}
    noise_snr_db: 20.0

range_processor:
    waveform: *waveform
    range_window: hann
clutter_filter:
    method: mean_subtraction
    doppler_window: &doppler_window hann
doppler_processor:
    waveform: *waveform
    doppler_window: *doppler_window
cfar_detector:
    cfar_variant: CA
    guard_cells: [3, 3]
    training_cells: [3, 3]
    pfa: 1.0e-9
    peak_mode: none
feature_assembly:
    features: [range, velocity]
cluster_dbscan:
    epsilon: [3.0, 2.0]
    min_points: 1
    max_clusters: 32
reduction:
    representative: medoid
    feature_weights: [0.3333, 0.5]
