app:
    waveform: &waveform
        carrier_frequency: 77.0e9
        bandwidth: 150.0e6
        chirp_duration: 20.0e-6
        sample_rate: 12.8e6
        chirp_repetition_interval: 25.0e-6
    cube:
        num_chirps: 128
        samples_per_chirp: 256
    run:
        # Frames 0..2199 cover 219.9 s and include the first CRI wrap at 200 s.
        num_frames: 2200
        frame_period: 0.1
        meter_cadence: true
        meter_log_every: 0
    visualization:
        enabled: true
        window_width: 1280
        window_height: 720
        window_title: FMCW SISO
        display_rate_hz: 20.0
        dynamic_range_db: 60.0
        detection_radius: 0.010
        history_frames: 120
        detection_trail_frames: 50
    # Relative monostatic range loss calibrates the target amplitude at its
    # 40 m initial range. CRI folding never resets this physical-distance loss.
    range_loss:
        model: monostatic_free_space
        reference_range: 40.0
    # R_CRI = c * 25 us / 2 = 3747.405725 m. Starting at 40 m and
    # receding at 18.537028625 m/s crosses that boundary at exactly 200 s.
    targets:
        - {range: 40.0, velocity: 18.537028625, amplitude: 0.8}
    noise_snr_db: 20.0

range_processor:
    waveform: *waveform
    range_window: hann
clutter_filter:
    method: mean_subtraction
    doppler_window: &doppler_window hann
doppler_processor:
    waveform: *waveform
    doppler_window: *doppler_window
cfar_detector:
    cfar_variant: CA
    guard_cells: [3, 3]
    training_cells: [3, 3]
    pfa: 1.0e-9
    peak_mode: none
feature_assembly:
    features: [range, velocity]
cluster_dbscan:
    epsilon: [3.0, 2.0]
    min_points: 1
    max_clusters: 32
reduction:
    representative: medoid
    feature_weights: [0.3333, 0.5]
