#
# Configuration for the FMCW MIMO TDM example (sparse angle-then-cluster path).
#
# waveform.chirp_repetition_interval is the per-TX effective PRI (M * physical)
# used by range/Doppler/compensation. sim.physical_chirp_repetition_interval is
# the on-wire spacing between consecutive interleaved chirps for the simulator.

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  # 2 TX * 25 us physical inter-chirp spacing on the wire.
  chirp_repetition_interval: 50.0e-6

sim:
  physical_chirp_repetition_interval: 25.0e-6

mimo_deinterleave:
  tx_schedule:
    num_tx: 2

mimo_coherent_compensation:
  multiplexing_scheme: tdm
  waveform: *waveform

virtual_array_assembly:
  overlap_policy: keep_all

range_processor:
  waveform: *waveform
  range_window: hann

clutter_filter:
  method: mean_subtraction

doppler_processor:
  waveform: *waveform
  doppler_window: hann

# NCI over the virtual channel axis (leading dim of assembled rd_maps).
cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  os_rank: 0
  nci_axes: [0]

snapshot_gather:
  snapshot_window: [0, 0]

beamscan_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.28, -0.26, -0.24, -0.22, -0.2, -0.18, -0.16, -0.14,
    -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0, 0.02, 0.04, 0.06, 0.08,
    0.1, 0.12, 0.14, 0.16, 0.18, 0.2, 0.22, 0.24, 0.26, 0.28, 0.3]
  el_angles: [-0.3, -0.28, -0.26, -0.24, -0.22, -0.2, -0.18, -0.16, -0.14,
    -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0, 0.02, 0.04, 0.06, 0.08,
    0.1, 0.12, 0.14, 0.16, 0.18, 0.2, 0.22, 0.24, 0.26, 0.28, 0.3]
  peak_interpolation: parabolic

cluster_dbscan:
  epsilon: [3.0, 2.0, 0.05, 0.05]
  min_points: 1
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5, 20.0, 20.0]

cube:
  chirps_per_tx: 64
  samples_per_chirp: 256

run:
  num_frames: 250
  frame_period: 0.1

# TX elements along the azimuth (y) aperture; spacing is in wavelengths.
tx_array:
  num_tx: 2
  spacing: 0.5

# RX URA in the y-z plane (same convention as fmcw_simo).
rx_array:
  az_elements: 4
  el_elements: 4
  spacing: 0.5

targets:
  - { range: 80.0,  azimuth: 0.15,  elevation: 0.10,  velocity: [1.0, -0.3, -0.2], amplitude: 0.8 }
  - { range: 95.0,  azimuth: -0.10, elevation: -0.08, velocity: [-0.5, 0.3, 0.25], amplitude: 0.6 }
  - { range: 110.0, azimuth: 0.0,   elevation: 0.05,  velocity: [-0.8, 0.4, -0.3], amplitude: 0.7 }

noise_snr_db: 18.0

visualize: true
skip_display_check: false
headless: false

plots:
  enable: true
  window: 120
