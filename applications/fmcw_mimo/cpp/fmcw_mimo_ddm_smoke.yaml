# Short linear-DDM smoke config for Graph-ported fmcw_mimo (few frames, viz off).

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  chirp_repetition_interval: 25.0e-6

multiplexing_scheme: ddm

ddm_dense_demultiplex:
  ddm_code:
    num_tx: 2
    doppler_offsets: [0.0, 0.5]
    guard_bands: 4

virtual_array_assembly:
  overlap_policy: keep_all

range_processor:
  waveform: *waveform
  range_window: hann

clutter_filter:
  method: mean_subtraction

doppler_processor:
  waveform: *waveform
  doppler_window: hann

cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  peak_only: false
  nci_axes: [0]

snapshot_gather:
  snapshot_window: [0, 0]

beamscan_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.2, -0.1, 0.0, 0.1, 0.2]
  el_angles: [-0.2, -0.1, 0.0, 0.1, 0.2]
  peak_interpolation: parabolic

cluster_dbscan:
  epsilon: [3.0, 2.0, 0.05, 0.05]
  min_points: 1
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5, 20.0, 20.0]

cube:
  num_chirps: 64
  samples_per_chirp: 256

run:
  num_frames: 2
  frame_period: 0.05
  meter_cadence: true
  meter_log_every: 0

tx_array:
  num_tx: 2
  spacing: 0.5

rx_array:
  az_elements: 4
  el_elements: 4
  spacing: 0.5

targets:
  - { range: 80.0,  azimuth: 0.15,  elevation: 0.10,  velocity: [1.0, -0.3, -0.2], amplitude: 0.8 }
  - { range: 95.0,  azimuth: -0.10, elevation: -0.08, velocity: [-0.5, 0.3, 0.25], amplitude: 0.6 }

noise_snr_db: 18.0

visualization:
  enabled: false
  window_width: 1280
  window_height: 720
  marker_radius: 0.004
  marker_outline: 0.002
  marker_segments: 20
  vsync: true
skip_display_check: false
headless: false

plots:
  enable: false
  window: 120
