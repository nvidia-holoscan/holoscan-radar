# Headless smoke config for
# applications/fmcw_aoa_estimators/python/fmcw_aoa_estimators.py. A short
# rotate_period (2) means a full 5-estimator cycle completes in 10 frames.

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  chirp_repetition_interval: 25.0e-6

range_processor:
  waveform: *waveform
  range_window: hann

clutter_filter:
  method: single_delay

doppler_processor:
  waveform: *waveform
  doppler_window: hann

cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  # Peak-grouping (non-maximum suppression). A native CFAR param; true → CFAR
  # emits one detection per target. The app also reads this key (a read-only
  # mirror of this block) to drop the DBSCAN clustering + reduction stages and
  # report the CFAR peaks directly (the angle branch still runs).
  peak_mode: none
  nci_axes: [0]

snapshot_gather:
  snapshot_window: [2, 1]

estimator_router:
  mode: rotate
  rotate_period: 2
  hold: beamscan
  control_path: ""
  log_every: 0

beamscan_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
  el_angles: [-0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15]
  peak_interpolation: parabolic

mvdr_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
  el_angles: [-0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15]
  diagonal_loading: -1.0
  max_sources: 1

music_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
  el_angles: [-0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15]
  num_sources: 1
  max_sources: 1

root_music_estimator:
  angle_convention:
    preset: radar_boresight
  num_sources: 1
  max_sources: 1

esprit_estimator:
  angle_convention:
    preset: radar_boresight
  num_sources: 1
  max_sources: 1

cluster_dbscan:
  epsilon: [3.0, 2.0, 0.05, 0.05]
  min_points: 1
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5, 20.0, 20.0]

cube:
  num_chirps: 64
  samples_per_chirp: 256

run:
  num_frames: 12
  frame_period: 0.1

rx_array:
  az_elements: 6
  el_elements: 6
  spacing: 0.5

# Purely radial velocities (= speed * dir(az, el)) so each target holds its
# angle; -v starts far, +v starts near, ~18 m/s radial-speed spread.
targets:
  - { range: 200.0, azimuth: 0.15,  elevation: 0.10,  velocity: [-8.8546, -1.3382, -0.8985], amplitude: 0.8 }
  - { range: 40.0,  azimuth: -0.10, elevation: -0.12, velocity: [8.8907, -0.8920, -1.0774],  amplitude: 0.6 }

noise_snr_db: 18.0

# Live RD-map visualization with CFAR detections overlaid as filled dots colored
# by DBSCAN cluster. enabled is the master switch; marker_radius / marker_outline
# are fractions of the RD image extent and marker_segments (>= 3) sets dot
# roundness. Off here — this is the headless smoke config.
visualization:
  enabled: false
  marker_radius: 0.004
  marker_outline: 0.002
  marker_segments: 20
  # vsync: true forces a FIFO present mode (frame-rate capped) — far more
  # robust to window-resize swap-chain errors than IMMEDIATE.
  vsync: true
headless: false
skip_display_check: false

plots:
  enable: true
  window: 120
