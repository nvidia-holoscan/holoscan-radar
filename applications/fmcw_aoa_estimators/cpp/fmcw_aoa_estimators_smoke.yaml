# Smoke config for fmcw_aoa_estimators (few frames, log-only, rotate every frame).

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  chirp_repetition_interval: 25.0e-6

range_processor:
  waveform: *waveform
  range_window: hann

# single_delay (first-order MTI) notches DC/near-DC. mean_subtraction only nulls
# the exact DC bin using the un-windowed slow-time mean, so once the Doppler
# Hann window is applied a near-DC residual survives and shows up as a spurious
# zero-velocity spike per fast target; the delay-line notch removes it while
# still passing the slow (+1.5 m/s) target.
clutter_filter:
  method: single_delay

doppler_processor:
  waveform: *waveform
  doppler_window: hann

# NCI over the RX axis (leading dim of rd_maps). nci_fold (K) is derived in the
# app from array_geometry.num_elements() and passed as an Arg.
cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  # Peak-grouping (non-maximum suppression). A native CFAR param; true → CFAR
  # emits one detection per target. The app also reads this key (a read-only
  # mirror of this block) to drop the DBSCAN clustering + reduction stages and
  # report the CFAR peaks directly (the angle branch still runs).
  peak_only: false
  nci_axes: [0]

# Multi-look neighborhood so the covariance/gridless estimators get K > 1
# snapshots per detection: K = (2*2+1) * (2*1+1) = 15. Beamscan is single-look,
# so its branch runs through SnapshotK1SliceOp (center look).
snapshot_gather:
  snapshot_window: [2, 1]

# Router selection policy:
#   mode: rotate | hold | file
#   rotate_period: frames each estimator dwells before advancing (rotate/file
#                  fallback). A full 5-estimator cycle takes 5 * rotate_period.
#   hold:          estimator name pinned in hold mode.
#   control_path:  file/FIFO polled each tick in file mode; write an estimator
#                  name (beamscan|mvdr|music|root_music|esprit, or 1-5) to
#                  switch live, empty/absent falls back to the rotation.
#   log_every:     also log the active estimator every N frames (0 = on change).
estimator_router:
  mode: rotate
  rotate_period: 1
  hold: beamscan
  control_path: ""
  log_every: 0

# Shared angle convention + (azimuth x elevation) scan grid for the grid-scan
# estimators. The filled y-z URA resolves BOTH axes, so el_angles is now a real
# 2-D grid (not the single 0 a line array is limited to).
beamscan_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.28, -0.26, -0.24, -0.22, -0.2, -0.18, -0.16, -0.14,
    -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0, 0.02, 0.04, 0.06, 0.08,
    0.1, 0.12, 0.14, 0.16, 0.18, 0.2, 0.22, 0.24, 0.26, 0.28, 0.3]
  el_angles: [-0.16, -0.14, -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0,
    0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.14, 0.16]
  peak_interpolation: parabolic

mvdr_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.28, -0.26, -0.24, -0.22, -0.2, -0.18, -0.16, -0.14,
    -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0, 0.02, 0.04, 0.06, 0.08,
    0.1, 0.12, 0.14, 0.16, 0.18, 0.2, 0.22, 0.24, 0.26, 0.28, 0.3]
  el_angles: [-0.16, -0.14, -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0,
    0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.14, 0.16]
  diagonal_loading: -1.0
  max_sources: 1

music_estimator:
  angle_convention:
    preset: radar_boresight
  az_angles: [-0.3, -0.28, -0.26, -0.24, -0.22, -0.2, -0.18, -0.16, -0.14,
    -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0, 0.02, 0.04, 0.06, 0.08,
    0.1, 0.12, 0.14, 0.16, 0.18, 0.2, 0.22, 0.24, 0.26, 0.28, 0.3]
  el_angles: [-0.16, -0.14, -0.12, -0.1, -0.08, -0.06, -0.04, -0.02, 0.0,
    0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.14, 0.16]
  num_sources: 1
  max_sources: 1

root_music_estimator:
  angle_convention:
    preset: radar_boresight
  num_sources: 1
  max_sources: 1

esprit_estimator:
  angle_convention:
    preset: radar_boresight
  num_sources: 1
  max_sources: 1

cluster_dbscan:
  epsilon: [3.0, 2.0, 0.05, 0.05]
  min_points: 1
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5, 20.0, 20.0]

cube:
  num_chirps: 128
  samples_per_chirp: 256

run:
  num_frames: 6
  frame_period: 0.1
  meter_cadence: true
  meter_log_every: 0

# RX filled uniform rectangular array in the y-z plane: az_elements columns
# (azimuth aperture, y) x el_elements rows (elevation aperture, z), laid out in
# (iz outer, iy inner) channel order. `spacing` is the element pitch as a
# fraction of the carrier wavelength (0.5 = half-wavelength); the loader converts
# it to meters at lambda = c / carrier_frequency. az_elements * el_elements feeds
# the CFAR NCI fold and every estimator's array_geometry.
rx_array:
  az_elements: 8
  el_elements: 8
  spacing: 0.5

# Position = range * dir(az, el). Four of the five targets carry a transverse
# velocity component (0.32-0.46 m/s) on top of the radial one, so their az/el
# sweep over the run; target 3 is the one purely radial reference. The
# transverse motion is small next to the ranges here, so each target's radial
# rate drifts by under 0.2 Doppler bins and the two close passes still coincide
# in range and Doppler. See the README for the scene.
targets:
  - { range: 245.0,  azimuth: 0.15,  elevation: 0.10,  velocity: [-6.3375, -1.4129, -0.5494], amplitude: 0.8 }
  - { range: 132.0,  azimuth: -0.10, elevation: -0.12, velocity: [1.5025, -0.3015, 0.1183],   amplitude: 0.6 }
  - { range: 22.0,   azimuth: 0.0,   elevation: 0.08,  velocity: [8.9712, 0.0, 0.7192],       amplitude: 0.7 }
  - { range: 117.0,  azimuth: 0.20,  elevation: 0.10,  velocity: [2.9310, 0.7166, 0.0010],    amplitude: 0.55 }
  - { range: 218.0,  azimuth: 0.17,  elevation: 0.04,  velocity: [-4.8577, -1.2600, -0.0800], amplitude: 0.7 }

noise_snr_db: 18.0

# Live RD-map visualization with CFAR detections overlaid as filled dots colored
# by DBSCAN cluster. enabled is the master switch; marker_radius / marker_outline
# are fractions of the RD image extent and marker_segments (>= 3) sets dot
# roundness.
visualization:
  enabled: false
  marker_radius: 0.004
  marker_outline: 0.002
  marker_segments: 20
  # vsync: true forces a FIFO present mode (frame-rate capped) — far more
  # robust to window-resize swap-chain errors than IMMEDIATE. Set false for
  # uncapped / low-latency rendering, at the cost of resize robustness (and
  # possible tearing).
  vsync: true
skip_display_check: false
headless: false

plots:
  enable: false
  window: 120
