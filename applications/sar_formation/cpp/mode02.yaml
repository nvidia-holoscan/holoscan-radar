#
# Mode-2 demo: video SAR of downtown Houston (INPUT_DATA.md).
# Full 23.5 s dwell at ~1.0 m ground-range GSD. Sliding window:
# retain ~0.92 s of pulses (1.0 m azimuth), emit every 4096
# pulses (~2.18 Hz at PRF 8942 Hz; four 1024-pulse reader
# ticks). emit-and-continue; signed weight evicts the trailing
# edge. 0.5 m (13600² / max_aperture 16524 / the 0p5m subset)
# ran ~4× behind collect time on this GPU; 6800² at 1.0 m was
# ~7% behind.
#
# Subset once (~27 GiB). The app never reaches the network.
#
#   python3 tools/sar_sim/subset_cphd.py \
#     tools/sar_sim/recipes/mode02_houston_1p0m.yaml \
#     --source /tmp/sar/2024-10-30-16-10-33_UMBRA-06_CPHD.cphd \
#     -o /tmp/sar
#   ./build/applications/sar_formation/cpp/sar_formation mode02.yaml
#
# Scene is counts × spacing (6.8 km IARP-centred ENU). Aperture
# 8262 is 2020 * 4.09 / 1.0 (the 4.09 m window scaled). No
# aperture_window: a sliding window is unweighted (~−13 dB).
# loop wraps until SIGINT. The wrap is collection_boundary
# (emit-and-reset): same IARP, but 22 deg of aspect between
# the last pulses and the first, so the window cannot
# straddle it.

cphd:
  path: /tmp/sar/mode02_houston_1p0m.cphd
  names:
    - Houston
  sidecar: ""

# Scene vs formed pixels. counts × spacing is the map (6.8 km
# at 1 m). max_side is the formed pixel side — the number to
# lower on a slower GPU (same km, coarser GSD; cost ~ N²).
# 6800 was ~7% behind collect time on RTX PRO 6000; 6144 is
# ~18% fewer pixels. 0 = use counts as-is.
# counts may be N (square) or [num_v, num_u].
lattice:
  counts: 6800
  spacing: 1.0
  max_side: 6144

cphd_reader:
  coordinate_frame: ecef
  pulses_per_tick: 1024
  loop: true
  playback_rate: 1
  duty_cycle: 1

# Sliding window. emit_interval is a multiple of
# pulses_per_tick (4096 = 4 ticks ≈ 2.18 Hz). weight is wired
# (modes 1 / 5 leave it unconnected).
aperture_manager:
  max_aperture_pulses: 8262
  emit_interval_pulses: 4096
  emit_mode: continue

nfft_pad: next_fast

range_compression: {}

backprojection:
  coordinate_frame: ecef

visualize: true
# Holoviz window (px), not formation cost. LUT box-averages
# the formed lattice to this. If the timeline HUD says
# "behind", lower lattice.max_side, not this.
visualize_size: 1024
skip_display_check: false
headless: false
visualize_hold_s: -1
