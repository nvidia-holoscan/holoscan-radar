# Headless smoke config for applications/fmcw_siso/python/fmcw_siso.py.
# Inherits the operator blocks from the C++ demo; short run, no Holoviz.

waveform: &waveform
  carrier_frequency: 77.0e9
  bandwidth: 150.0e6
  chirp_duration: 20.0e-6
  sample_rate: 12.8e6
  chirp_repetition_interval: 25.0e-6

range_processor:
  waveform: *waveform
  range_window: hann

clutter_filter:
  method: mean_subtraction

doppler_processor:
  waveform: *waveform
  doppler_window: hann

cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  os_rank: 0

cluster_dbscan:
  epsilon: [3.0, 2.0]
  min_points: 1
  max_clusters: 0

reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5]

cube:
  num_chirps: 128
  samples_per_chirp: 256

run:
  num_frames: 2
  frame_period: 0.1

targets:
  - { range: 60.0, velocity: 0.0, amplitude: 1.0 }
  - { range: 45.0, velocity: 2.5, amplitude: 0.5 }
  - { range: 130.0, velocity: 1.5, amplitude: 0.45 }
  - { range: 200.0, velocity: -1.5, amplitude: 0.4 }

noise_snr_db: 20.0

visualize: false
skip_display_check: false
headless: false

plots:
  enable: true
  window: 120
