#
# Configuration for the FMCW SISO example application. Loaded at startup by
# fmcw_siso (pass a path as the first CLI argument to override; otherwise the
# copy staged next to the executable is used).
#
# The per-operator blocks (range_processor, clutter_filter,
# doppler_processor) are consumed natively via Holoscan's from_config(): every
# key is an operator parameter, converted by the YAML::convert<>
# specializations in radar_common/sdk/yaml_converters.hpp. The cfar_detector
# block is parsed by the app (no YAML::convert for CfarVariant yet) and
# applied as Args. The remaining top-level sections (cube, run, targets,
# noise_snr_db) configure the app's synthetic source and run cadence.

# FMCW waveform, anchored so the range and Doppler blocks (and the app's
# simulator mirror) share one definition. Provide exactly one of `bandwidth`
# or `chirp_slope`; the descriptor derives the other. See
# FMCWWaveformDescriptor.
waveform: &waveform
  carrier_frequency: 77.0e9           # Hz
  bandwidth: 150.0e6                   # Hz
  chirp_duration: 20.0e-6              # s
  sample_rate: 12.8e6                  # Hz
  chirp_repetition_interval: 25.0e-6   # s (PRI)

# FMCWRangeProcessorOp parameters. Optional keys (operator defaults apply
# when omitted):
#   range_window: hann                 # or a map: {type: kaiser, ...}
#   apply_dechirp: false
#   fft_norm: backward                 # backward | ortho | forward
#   nfft: 512
#   propagation_speed: 299792458.0     # m/s
range_processor:
  waveform: *waveform

# ClutterFilterOp parameters: method is one of mean_subtraction,
# single_delay, double_delay.
clutter_filter:
  method: mean_subtraction

# FMCWDopplerProcessorOp parameters. Optional keys as above, plus:
#   doppler_window: hann
#   center_zero_doppler: true
doppler_processor:
  waveform: *waveform

# CFARDetectorOp parameters (app-parsed). guard_cells / training_cells are
# (doppler, range) half-extents; pfa sets the CA threshold multiplier.
# os_rank is only required when cfar_variant is OS.
cfar_detector:
  cfar_variant: CA
  guard_cells: [1, 1]
  training_cells: [2, 2]
  pfa: 1.0e-6
  os_rank: 0

# ADC data-cube dimensions per coherent processing interval (CPI).
cube:
  num_chirps: 128
  samples_per_chirp: 256

# Run cadence. The source emits `num_frames` cubes, one every `frame_period`
# seconds, advancing the targets through space between frames.
run:
  num_frames: 100
  frame_period: 0.1                    # s (10 Hz → ~10 s total)

# Scene targets. Each is placed along the +x look direction at `range` metres,
# closing/receding at `velocity` m/s (positive = receding), with a linear
# `amplitude`.
targets:
  - { range: 60.0, velocity: 0.0, amplitude: 1.0 }   # static clutter
  - { range: 42.0, velocity: 5.5, amplitude: 0.5 }   # moving target

# Additive complex white Gaussian noise, SNR in dB relative to a unit-amplitude
# target. Required for CFAR: a noise-free cube yields a zero training-cell
# noise estimate, so the adaptive threshold collapses and no cells detect.
# Set to null (or omit) only when exercising the signal-processing chain alone.
noise_snr_db: 20.0

# Live RD-map visualization (Holoviz turbo-colormapped image of the
# log-magnitude map). Requires a GUI-capable host; when no display is
# detected the app warns and runs as if this were false.
visualize: false

# Skip the startup display probe (a brief Holoviz window init/teardown).
# Saves the probe's startup cost on hosts known to have a working display,
# but if none is available the app aborts mid-graph instead of falling back
# to running without the window.
skip_display_check: false
