#
# Configuration for the FMCW SISO example application. Loaded at startup by
# fmcw_siso (pass a path as the first CLI argument to override; otherwise the
# copy staged next to the executable is used).
#
# The per-operator blocks (range_processor, clutter_filter, doppler_processor,
# cfar_detector, cluster_dbscan, reduction) are consumed natively via
# Holoscan's from_config(): every key is an operator parameter, converted by
# the YAML::convert<> specializations (in radar_common/sdk/yaml_converters.hpp
# and each operator's own translation unit). FeatureAssemblyOp's `features`
# is fixed in the app code (native-only param). The remaining top-level
# sections (cube, run, targets, noise_snr_db) configure the app's synthetic
# source and run cadence.

# FMCW waveform, anchored so the range and Doppler blocks (and the app's
# simulator mirror) share one definition. Provide exactly one of `bandwidth`
# or `chirp_slope`; the descriptor derives the other. See
# FMCWWaveformDescriptor.
waveform: &waveform
  carrier_frequency: 77.0e9           # Hz
  bandwidth: 150.0e6                   # Hz
  chirp_duration: 20.0e-6              # s
  sample_rate: 12.8e6                  # Hz
  chirp_repetition_interval: 25.0e-6   # s (PRI)

# FMCWRangeProcessorOp parameters. Optional keys (operator defaults apply
# when omitted):
#   range_window: hann                 # or a map: {type: kaiser, ...}
#   apply_dechirp: false
#   fft_norm: backward                 # backward | ortho | forward
#   nfft: 512
#   propagation_speed: 299792458.0     # m/s
range_processor:
  waveform: *waveform
  range_window: hann

# ClutterFilterOp parameters: method is one of mean_subtraction,
# single_delay, double_delay.
clutter_filter:
  method: mean_subtraction

# FMCWDopplerProcessorOp parameters. Optional keys as above, plus:
#   doppler_window: hann
#   center_zero_doppler: true
doppler_processor:
  waveform: *waveform
  doppler_window: hann

# CFARDetectorOp parameters (native from_config). guard_cells / training_cells
# are (doppler, range) half-extents; pfa sets the CA threshold multiplier.
# os_rank is only required when cfar_variant is OS.
cfar_detector:
  cfar_variant: CA
  guard_cells: [3, 3]
  training_cells: [3, 3]
  pfa: 1.0e-9
  os_rank: 0
  # Peak-grouping (non-maximum suppression). A native CFAR param; true → CFAR
  # emits one detection per target. The app also reads this key (a read-only
  # mirror of this block) to drop the DBSCAN clustering + reduction stages and
  # report the CFAR peaks directly.
  peak_only: false

# ClusterDBSCANOp parameters (native from_config). FeatureAssemblyOp assembles
# the `points` matrix (this app fixes its columns to [range (m), velocity
# (m/s)] in code), then ClusterDBSCANOp density-clusters it.
#   epsilon      — per-feature neighborhood radius, matching the feature order
#                  (here metres, then m/s). Length 1 → isotropic.
#   min_points   — DBSCAN minPts (neighbors incl. self for a core point);
#                  <= 0 selects the 2*num_features default.
#   max_clusters — cap on reported clusters (surplus dropped to noise);
#                  <= 0 is uncapped.
cluster_dbscan:
  epsilon: [3.0, 2.0]
  min_points: 1
  max_clusters: 0

# DetectionReductionOp parameters (native from_config): reduces each cluster to
# one representative cell, used as the cluster's centroid in the GUI + logs.
#   representative  — medoid | peak | first. medoid is the most-central real
#                     detection; peak needs a score feature this app's
#                     [range, velocity] points don't provide.
#   score_method    — weighted_sum | weighted_l2 | weighted_max (peak only).
#   feature_weights — per-feature weights for the medoid metric, [range,
#                     velocity] order. Set ~ 1/epsilon so the metric matches
#                     the DBSCAN neighborhood (else range's larger magnitude
#                     dominates velocity).
reduction:
  representative: medoid
  feature_weights: [0.3333, 0.5]

# ADC data-cube dimensions per coherent processing interval (CPI).
cube:
  num_chirps: 128
  samples_per_chirp: 256

# Run cadence. The source emits `num_frames` cubes, one every `frame_period`
# seconds, advancing the targets through space between frames.
# meter_cadence — log WARN when source inter-emit or DetectionReport e2e
#   exceeds frame_period (+ max(10 ms, 10% of period) slack); print a summary at exit (default true).
# meter_log_every — also INFO e2e every N sink frames (0 = warn/summary only).
run:
  num_frames: 300
  frame_period: 0.1                    # s (10 Hz → ~30 s total)
  meter_cadence: true
  meter_log_every: 0

# Scene targets. Each is placed along the +x look direction at `range` metres,
# closing/receding at `velocity` m/s (positive = receding), with a linear
# `amplitude`. Mean-subtraction clutter filter suppresses the static return.
#
# Trajectories are chosen to stay inside the unambiguous range/velocity
# envelope for the full run (300 frames × 0.1 s): with these cube dims and
# waveform, beat-frequency range wraps above ~256 m and |velocity| folds above
# ~39 m/s. Every radial sits on a Doppler bin center (a multiple of the
# ~0.6083 m/s bin) so the velocity chart reads as flicker-free lines.
#
# Three well-separated speed lines (-6.7 / +1.2 / +6.7 m/s) plus two close-pass
# partners, each 3 bins (1.83 m/s) off its target: resolvable in Doppler, but
# inside the 2.0 m/s clustering epsilon, so DBSCAN can merge the pair while the
# ranges cross. SISO has no angle axis, so both passes are genuinely
# unresolvable at closest approach -- the merges are the point. See the README.
targets:
  - { range: 60.0,  velocity: 0.0,     amplitude: 1.0 }  # static clutter (suppressed)
  - { range: 235.0, velocity: -6.6918, amplitude: 0.8 }  # fast approaching, far → near
  - { range: 130.0, velocity: 1.2167,  amplitude: 0.6 }  # slow receding
  - { range: 20.0,  velocity: 6.6918,  amplitude: 0.7 }  # fast receding, near → far
  - { range: 112.0, velocity: 3.0417,  amplitude: 0.55 } # close pass on the slow target (~10 s)
  - { range: 208.0, velocity: -4.8668, amplitude: 0.7 }  # close pass on the fast approacher (~15 s)

# Additive complex white Gaussian noise, SNR in dB relative to a unit-amplitude
# target. Required for CFAR: a noise-free cube yields a zero training-cell
# noise estimate, so the adaptive threshold collapses and no cells detect.
# Set to null (or omit) only when exercising the signal-processing chain alone.
noise_snr_db: 20.0

# Live RD-map visualization (Holoviz turbo-colormapped image of the
# log-magnitude map, with the CFAR detections overlaid as filled dots colored
# by DBSCAN cluster). Requires a GUI-capable host; when no display is detected
# the app warns and runs as if disabled.
#   enabled         — master switch for the live Holoviz window
#   marker_radius   — detection-dot radius, as a fraction of the RD image extent
#   marker_outline  — extra radius of each dot's black outline ring (same units)
#   marker_segments — triangle-fan segments per dot (roundness; must be >= 3)
visualization:
  enabled: true
  marker_radius: 0.004
  marker_outline: 0.002
  marker_segments: 20
  # vsync: true forces a FIFO present mode (frame-rate capped) — far more
  # robust to window-resize swap-chain errors than IMMEDIATE. Set false for
  # uncapped / low-latency rendering, at the cost of resize robustness (and
  # possible tearing).
  vsync: true

# Skip the startup display probe (a brief Holoviz window init/teardown).
# Saves the probe's startup cost on hosts known to have a working display,
# but if none is available the app aborts mid-graph instead of falling back
# to running without the window.
skip_display_check: false

# Render Holoviz offscreen (no window). Lets the visual pipeline run on a
# display-less host (CI, headless dev boxes); the startup display probe is
# skipped when set. Combine with visualization.enabled: true.
headless: false

# Rolling time-series plots drawn to the right of the RD map (only when
# visualization is enabled). Two scrolling scatter plots — range (m) vs time and
# velocity (m/s) vs time — where every detection is a dot colored by its
# DBSCAN cluster (noise gray) and each cluster's centroid is a '+' marker in
# the same color. Y axes are fixed to the range/velocity bin extents.
#   enable — draw the plots (false → RD map fills the window, as before)
#   window — number of frames retained in the scrolling window (must be > 1)
plots:
  enable: true
  window: 120
