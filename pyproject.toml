[build-system]
requires = ["scikit-build-core==1.0.3", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "holoscan-radar"
version = "1.0.0"
description = "Accelerated radar signal processing operators for the Holoscan ecosystem"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Holoscan Team" },
]
requires-python = ">=3.12"

# Development tools stay out of the published radar wheel. The CLI requires
# Python 3.12; the radar wheel uses the SDK's CPython 3.12 stable ABI.
[dependency-groups]
cli = ["holoscan-cli==5.0.0"]
test = ["pytest==8.4.2", "pytest-timeout==2.4.0"]

[tool.uv]
package = false
default-groups = ["cli", "test"]

[tool.uv.dependency-groups]
cli = { requires-python = ">=3.11" }

[tool.uv.sources]
holoscan-cli = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

# NOTE: holoscan SDK is not declared as a runtime dependency here because the
# wheel cannot guarantee binary compatibility across CUDA variants (cu12/cu13).
# Document the install command in the README.

[tool.scikit-build]
cmake.version = ">=4.0"
cmake.build-type = "Release"
# Wheel content comes only from the holoscan-wheel-radar install component
# (python/cmake/wheel.cmake): the operators-only holoscan_radar package and the
# native libraries it owns under holoscan_radar/lib.
wheel.packages = []
wheel.py-api = "cp312"
install.components = ["holoscan-wheel-radar"]

# Build the FMCW and SAR operators the provider registers; no apps or tests.
[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = true
BUILD_ALL = false
HOLOSCAN_RADAR_BUILD_PYTHON = true
HOLOSCAN_RADAR_BUILD_TESTING = false
# TensorDumpOp is a debugging tap; source builds keep it, the wheel omits it.
HOLOSCAN_RADAR_PYTHON_TENSOR_DUMP = false

[tool.holoscan]
repo-prefix = "holoscan-radar"
container-prefix = "holoscan-radar"
workspace-name = "holoscan-radar"
cuda = 13
ctest-script = "ci/container.ctest"

[tool.ruff]
line-length = 100
target-version = "py312"
# Build and wheel outputs plus local caches are excluded from lint discovery.
exclude = [
    "build*",
    "dist",
    ".cache",
    ".local",
    ".cupy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E402: intentional late imports after build-path / cupy / importorskip setup.
# I001: leave import sorting to the dedicated isort pre-commit hook.
ignore = ["E501", "UP007", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["holoscan"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["holoscan"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = """
/(
  \\.cache
  | build[^/]*
  | install[^/]*
  | \\.local
)/
"""

[project.entry-points."holoscan.modules"]
radar = "holoscan_radar"
