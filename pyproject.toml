[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "holoscan-radar"
version = "0.1.0"
description = "Accelerated radar signal processing operators for the Holoscan ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Holoscan Team" },
]
requires-python = ">=3.10"

# NOTE: holoscan SDK is not declared as a runtime dependency here because the
# wheel cannot guarantee binary compatibility across CUDA variants (cu12/cu13).
# Document the install command in the README.

[tool.scikit-build]
cmake.version = ">=3.24"
# Build only what the wheel needs: turn off test and app subprojects, and
# turn off the deb option (which is build-type-driven, not wheel-driven).
# BUILD_ALL=ON enables every OP_* so the wheel ships the full operator set
# + Python bindings (radar_app viz ops are built with operators/).
cmake.args = [
    "-DHOLOSCAN_RADAR_BUILD_TESTING=OFF",
    "-DBUILD_ALL=ON",
]
# Wheel content comes from CMake install rules. Use *relative* DESTINATIONs in
# install(...) calls — scikit-build-core stages those into the wheel root.
# Setting wheel.install-dir = "/" would require the experimental flag.
wheel.packages = []

[tool.holoscan]
repo-prefix = "holoscan-radar"
container-prefix = "holoscan-radar"
workspace-name = "holoscan-radar"
cuda = 13
ctest-script = "ci/container.ctest"

[tool.ruff]
line-length = 100
target-version = "py310"
# The post-gen hook copies cmake/pybind11/ into this tree from the HoloHub
# clone; build*/, dist/ are CMake/wheel outputs; .local/, .cache/, .cupy/
# are dev-container HOME junk.
exclude = [
    "build*",
    "dist",
    ".cache",
    ".local",
    ".cupy",
    "cmake/pybind11",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E402: intentional late imports after build-path / cupy / importorskip setup.
# I001: leave import sorting to the dedicated isort pre-commit hook.
ignore = ["E501", "UP007", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["holoscan"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["holoscan"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = """
/(
  \\.cache
  | build[^/]*
  | install[^/]*
  | cmake/pybind11
  | \\.local
)/
"""
