# A workflow to trigger ci on hybrid infra (github + self hosted runner)
name: Blossom-CI
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
      inputs:
          platform:
            description: 'runs-on argument'
            required: false
          args:
            description: 'argument'
            required: false

# Default to read-only; jobs below opt in to the extra scopes they need.
permissions:
  contents: read

jobs:
  Authorization:
    name: Authorization
    runs-on: blossom
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      args: ${{ env.args }}

    # This job only runs for '/build' comments on pull requests from authorized users
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/build' &&
      contains(fromJSON('["tbirdso", "wendell-hom", "wyli", "jjomier", "dylan-eustice", "danpcampbell"]'), github.actor) &&
      contains(fromJSON('["tbirdso", "wendell-hom", "wyli", "jjomier", "dylan-eustice", "danpcampbell"]'), github.triggering_actor)

    steps:
      - name: Check if comment is issued by authorized person
        run: blossom-ci
        env:
          OPERATION: 'AUTH'
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}

  Vulnerability-scan:
    name: Vulnerability scan
    needs: [Authorization]
    # GitHub can rerun downstream jobs without rerunning Authorization, so
    # re-check who triggered the run before touching fork code with secrets.
    if: contains(fromJSON('["tbirdso", "wendell-hom", "wyli", "jjomier", "dylan-eustice", "danpcampbell"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ fromJson(needs.Authorization.outputs.args).repo }}
          ref: ${{ fromJson(needs.Authorization.outputs.args).ref }}
          lfs: 'true'
          persist-credentials: false

      - name: Run blossom action
        # Update this immutable action revision through normal review.
        uses: NVIDIA/blossom-action@2b0c950b993808dc31f80a1ccc32615902e39032
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_KEY_DATA: ${{ secrets.BLOSSOM_KEY }}
        with:
          args1: ${{ fromJson(needs.Authorization.outputs.args).args1 }}
          args2: ${{ fromJson(needs.Authorization.outputs.args).args2 }}
          args3: ${{ fromJson(needs.Authorization.outputs.args).args3 }}

  Job-trigger:
    name: Start ci job
    needs: [Vulnerability-scan]
    if: contains(fromJSON('["tbirdso", "wendell-hom", "wyli", "jjomier", "dylan-eustice", "danpcampbell"]'), github.triggering_actor)
    runs-on: blossom
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Start ci job
        run: blossom-ci
        env:
          OPERATION: 'START-CI-JOB'
          CI_SERVER: ${{ secrets.CI_SERVER }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Upload-Log:
    name: Upload log
    runs-on: blossom
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Only accept result-posting dispatches that run from the default branch.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Jenkins log for pull request ${{ fromJson(github.event.inputs.args).pr }} (click here)
        run: blossom-ci
        env:
          OPERATION: 'POST-PROCESSING'
          CI_SERVER: ${{ secrets.CI_SERVER }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
