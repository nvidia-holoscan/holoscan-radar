version: 2
operator: fmcw_range_processor
axes: [chirps, samples]
profiles:
  small: {shape: [16, 128]}
  medium: {shape: [64, 512]}
  large: {shape: [128, 1024]}
live_ports: [range_window, apply_dechirp, waveform, fft_norm, nfft]
recipe:
  operator_type: radar.FMCWRangeProcessorOp.float
  inputs:
    - {port: adc_cube, shape: [channels, chirps, samples], omit_if_one: [channels], dtype: complex64, memory: device, generator: iq_cube}
  fixtures: {channels: 1}
  constructor: {bounds_policy: range_fft_bounds}
  params:
    range_window: {type: none}
    apply_dechirp: false
    fft_norm: backward
    waveform: {factory: valid_fmcw_waveform, carrier_frequency: 77000000000, bandwidth: 150000000, chirp_duration: 0.000020, sample_rate: 12800000, pri_seconds: 0.000025}
    nfft: 0
  outputs: {timed: range_profiles, drain: [range_bins], unwired: [], optional_tensor_outputs: [range_bins]}
  live:
    range_window: {physical_port: range_window, codec: window_spec}
    apply_dechirp: {physical_port: apply_dechirp, codec: bool}
    waveform: {physical_port: waveform, codec: waveform_descriptor}
    fft_norm: {physical_port: fft_norm, codec: enum}
    nfft: {physical_port: nfft, codec: scaled_axis, axis: samples}
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {}}
  - {id: hann-medium, profile: medium, scopes: [limited], parameters: {range_window: {type: hann}}}
  - {id: four-channels-medium, profile: medium, scopes: [limited], parameters: {}, fixture: {channels: 4}}
  - {id: padded-medium, profile: medium, scopes: [limited], parameters: {nfft: 1024}}
  - {id: "window-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: range_window, value: {type: hann}}}
  - {id: "dechirp-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: apply_dechirp, value: true}}
  - {id: "waveform-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {}, override: {port: waveform, value: {pri_seconds: 0.00003}}}
  - {id: "norm-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {}, override: {port: fft_norm, value: ortho}}
  - {id: "nfft-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: nfft, value: {scale: 2}, cache: unseen}}
  - {id: dechirp-hann-medium, profile: medium, scopes: [moderate], parameters: {range_window: {type: hann}, apply_dechirp: true}}
  - {id: hamming-window-medium, profile: medium, scopes: [thorough], parameters: {range_window: {type: hann}, fft_norm: ortho}, override: {port: range_window, value: {type: hamming}}}
  - {id: nfft-cached-medium, profile: medium, scopes: [thorough], parameters: {}, override: {port: nfft, value: {scale: 2}, cache: cached}}
  - id: window-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: range_window
      value:
        type: hann
      cache: cached
  - id: dechirp-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: apply_dechirp
      value: true
      cache: cached
  - id: waveform-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: waveform
      value:
        pri_seconds: 3.0e-05
      cache: cached
  - id: norm-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: fft_norm
      value: ortho
      cache: cached
  - id: nfft-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: nfft
      value:
        scale: 2
      cache: cached
  - id: hamming-window-medium-cached
    profile: medium
    scopes:
    - thorough
    parameters:
      range_window:
        type: hann
      fft_norm: ortho
    override:
      port: range_window
      value:
        type: hamming
      cache: cached
  - id: optional-minimal-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    output_mode: minimal
