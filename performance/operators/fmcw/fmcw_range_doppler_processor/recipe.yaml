version: 2
operator: fmcw_range_doppler_processor
profiles:
  small:
    shape:
    - 16
    - 128
  medium:
    shape:
    - 64
    - 512
  large:
    shape:
    - 128
    - 1024
live_ports:
- range_window
- doppler_window
- apply_dechirp
- clutter_filter
- waveform
- fft_norm
- center_zero_doppler
- nfft_range
- nfft_doppler
cases:
- id: baseline-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - minimal
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
- id: mean-medium
  profile: medium
  scopes:
  - limited
  parameters:
    clutter_filter: mean_subtraction
    range_window:
      type: none
    doppler_window:
      type: none
- id: single-delay-medium
  profile: medium
  scopes:
  - limited
  parameters:
    clutter_filter: single_delay
    range_window:
      type: none
    doppler_window:
      type: none
- id: hann-medium
  profile: medium
  scopes:
  - limited
  parameters:
    range_window:
      type: hann
    doppler_window:
      type: hann
- id: four-channels-medium
  profile: medium
  scopes:
  - limited
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  fixture:
    channels: 4
- id: range-window-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: range_window
    value:
      type: hann
- id: doppler-window-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: doppler_window
    value:
      type: hann
- id: dechirp-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: apply_dechirp
    value: true
- id: clutter-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: clutter_filter
    value: mean_subtraction
- id: waveform-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: waveform
    value:
      pri_seconds: 3.0e-05
- id: norm-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: fft_norm
    value: ortho
- id: shift-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: center_zero_doppler
    value: false
- id: nfft-range-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: nfft_range
    value:
      scale: 2
- id: nfft-doppler-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters:
    range_window:
      type: none
    doppler_window:
      type: none
  override:
    port: nfft_doppler
    value:
      scale: 2
- id: dechirp-hann-medium
  profile: medium
  scopes:
  - moderate
  parameters:
    clutter_filter: mean_subtraction
    range_window:
      type: hann
    doppler_window:
      type: hann
    apply_dechirp: true
- id: delay-hamming-large
  profile: large
  scopes:
  - thorough
  parameters:
    clutter_filter: single_delay
    range_window:
      type: hann
    doppler_window:
      type: hamming
    fft_norm: ortho
axes:
- chirps
- samples
recipe:
  operator_type: radar.FMCWRangeDopplerProcessorOp.float
  inputs:
  - port: adc_cube
    shape:
    - channels
    - chirps
    - samples
    omit_if_one:
    - channels
    dtype: complex64
    memory: device
    generator: iq_cube
  fixtures:
    channels: 1
  constructor:
    bounds_policy: fused_fft_bounds
  params:
    waveform:
      factory: valid_fmcw_waveform
      carrier_frequency: 77000000000
      bandwidth: 150000000
      chirp_duration: 2.0e-05
      sample_rate: 12800000
      pri_seconds: 2.5e-05
    clutter_filter: none
    range_window:
      type: none
    doppler_window:
      type: none
    apply_dechirp: false
    fft_norm: backward
    center_zero_doppler: true
    nfft_range: 0
    nfft_doppler: 0
  outputs:
    timed: rd_maps
    drain:
    - range_bins
    - velocity_bins
    unwired: []
  live:
    range_window:
      physical_port: range_window
      codec: window_spec
    doppler_window:
      physical_port: doppler_window
      codec: window_spec
    apply_dechirp:
      physical_port: apply_dechirp
      codec: bool
    clutter_filter:
      physical_port: clutter_filter
      codec: clutter_enum
    waveform:
      physical_port: waveform
      codec: waveform_descriptor
    fft_norm:
      physical_port: fft_norm
      codec: fft_norm_enum
    center_zero_doppler:
      physical_port: center_zero_doppler
      codec: bool
    nfft_range:
      physical_port: nfft_range
      codec: scaled_axis
      axis: samples
    nfft_doppler:
      physical_port: nfft_doppler
      codec: scaled_axis
      axis: chirps
