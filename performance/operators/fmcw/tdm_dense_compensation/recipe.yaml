version: 2
operator: tdm_dense_compensation
axes: [tx, rx, doppler, range]
profiles:
  small: {shape: [2, 4, 32, 128]}
  medium: {shape: [4, 16, 128, 512]}
  large: {shape: [8, 32, 256, 1024]}
live_ports: [waveform]
recipe:
  operator_type: radar.TDMDenseCompensationOp.float
  inputs:
    - {port: rd_maps, shape: [tx, rx, doppler, range], dtype: complex64, memory: device, generator: iq_cube}
  constructor: {extents: {max_tx: tx, max_rx: rx, max_doppler_bins: doppler, max_range_bins: range}}
  params:
    waveform: {factory: valid_fmcw_waveform, carrier_frequency: 77000000000, bandwidth: 150000000, chirp_duration: 0.000020, sample_rate: 12800000, pri_seconds: 0.000025}
  outputs: {timed: rd_maps_out, drain: [], unwired: []}
  live:
    waveform: {physical_port: waveform, codec: waveform_descriptor}
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {}}
  - {id: longer-pri-medium, profile: medium, scopes: [limited], parameters: {waveform: {pri_seconds: 0.00003}}}
  - {id: "waveform-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: waveform, value: {pri_seconds: 0.00003}}}
  - {id: alternate-waveform-medium, profile: medium, scopes: [thorough], parameters: {}, override: {port: waveform, value: {pri_seconds: 0.0000275}}}
