version: 2
operator: tdm_sparse_compensation
axes: [tx, rx, doppler, range, detections]
profiles:
  small: {shape: [2, 4, 64, 256, 16]}
  medium: {shape: [4, 8, 256, 512, 256]}
  large: {shape: [4, 16, 512, 1024, 1024]}
live_ports: [waveform, snapshot_window]
recipe:
  operator_type: radar.TDMSparseCompensationOp.float
  inputs:
    - {port: rd_maps, shape: [tx, rx, doppler, range], dtype: complex64, memory: device, generator: iq_cube}
    - {port: detection_idx, shape: [detections, two], dtype: int64, memory: device, generator: in_bounds_rd_indices}
  fixtures: {two: 2}
  constructor: {bounds_policy: sparse_mimo_bounds}
  params:
    waveform: {factory: valid_fmcw_waveform, carrier_frequency: 77000000000, bandwidth: 1000000000, chirp_duration: 0.000040, sample_rate: 20000000, pri_seconds: 0.001}
    tx_positions: {factory: linear_positions, spacing: 0.02, coordinate: 0}
    rx_positions: {factory: linear_positions, spacing: 0.002, coordinate: 0}
    overlap_policy: keep_all
    snapshot_window: [0, 0]
  outputs: {timed: snapshot, drain: [is_valid, array_geometry], drain_codecs: {array_geometry: array_geometry}, unwired: [], optional_tensor_outputs: [is_valid]}
  live:
    waveform: {physical_port: waveform, codec: waveform_descriptor}
    snapshot_window: {physical_port: snapshot_window, codec: sparse_window}
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {}}
  - {id: neighborhood-medium, profile: medium, scopes: [limited], parameters: {snapshot_window: [1, 1]}}
  - {id: dedup-medium, profile: medium, scopes: [limited], parameters: {overlap_policy: dedup}}
  - {id: longer-pri-medium, profile: medium, scopes: [limited], parameters: {waveform: {pri_seconds: 0.0011}}}
  - {id: "waveform-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: waveform, value: {pri_seconds: 0.0011}}}
  - {id: "window-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: snapshot_window, value: [1, 1]}}
  - {id: average-window-medium, profile: medium, scopes: [thorough], parameters: {snapshot_window: [1, 1], overlap_policy: average}, override: {port: snapshot_window, value: [2, 2]}}
  - id: waveform-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: waveform
      value:
        pri_seconds: 0.0011
      cache: cached
  - id: window-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: snapshot_window
      value:
      - 1
      - 1
      cache: cached
  - id: average-window-medium-cached
    profile: medium
    scopes:
    - thorough
    parameters:
      snapshot_window:
      - 1
      - 1
      overlap_policy: average
    override:
      port: snapshot_window
      value:
      - 2
      - 2
      cache: cached
  - id: optional-minimal-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    output_mode: minimal
