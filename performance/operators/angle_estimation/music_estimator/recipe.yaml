version: 2
operator: music_estimator
profiles:
  small:
    shape:
    - 4
    - 64
    - 16
    - 21
    - 11
  medium:
    shape:
    - 8
    - 128
    - 32
    - 41
    - 21
  large:
    shape:
    - 16
    - 256
    - 48
    - 61
    - 31
live_ports:
- array_geometry
- az_coordinates
- el_coordinates
- spatial_smoothing
- num_sources
- source_count_pfa
- max_sources
cases:
- id: baseline-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - minimal
  parameters: {}
- id: parameter-medium
  profile: medium
  scopes:
  - limited
  parameters:
    num_sources: 2
- id: parameter-large
  profile: large
  scopes:
  - moderate
  parameters:
    num_sources: 2
- id: array-geometry-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
- id: az-coordinates-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: az_coordinates
    value:
      shift: 0.05
- id: el-coordinates-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters: {}
  override:
    port: el_coordinates
    value:
      shift: 0.05
- id: spatial-smoothing-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters: {}
  override:
    port: spatial_smoothing
    value:
    - 2
- id: num-sources-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: num_sources
    value: 2
- id: source-count-pfa-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters: {}
  override:
    port: source_count_pfa
    value: 0.001
- id: max-sources-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters: {}
  override:
    port: max_sources
    value: 3
- id: transition-medium
  profile: medium
  scopes:
  - thorough
  parameters:
    num_sources: 2
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
axes:
- channels
- detections
- snapshots
- az
- el
recipe:
  operator_type: radar.MUSICEstimatorOp.float
  inputs:
  - port: snapshot
    shape:
    - detections
    - channels
    - snapshots
    dtype: complex64
    memory: device
    generator: iq_cube
  fixtures:
    max_sources_bound: 4
  constructor:
    extents:
      max_items: detections
      max_channels: channels
      max_sources: max_sources_bound
      max_az: az
      max_el: el
  params:
    array_geometry:
      factory: ula_geometry
      spacing_wavelengths: 0.5
      wavelength: 1.0
    angle_convention:
      preset: radar_boresight
    az_coordinates:
      factory: linspace
      count: az
      start: -0.5
      stop: 0.5
    el_coordinates:
      factory: linspace
      count: el
      start: -0.3
      stop: 0.3
    num_sources: -1
    source_count_pfa: 0.01
    max_sources: 4
    spatial_smoothing: []
  outputs:
    timed: aoa_estimates
    drain:
    - angle_spectrum
    - doa_multi
    - source_count
    - eigenvalues
    unwired: []
    queue_depth: 8
  live:
    array_geometry:
      physical_port: array_geometry
      codec: ula_geometry_patch
    az_coordinates:
      physical_port: az_coordinates
      codec: shifted_linspace
    el_coordinates:
      physical_port: el_coordinates
      codec: shifted_linspace
    spatial_smoothing:
      physical_port: spatial_smoothing
      codec: spatial_smoothing
    num_sources:
      physical_port: num_sources
      codec: int64
    source_count_pfa:
      physical_port: source_count_pfa
      codec: double
    max_sources:
      physical_port: max_sources
      codec: int64
