version: 2
operator: beamscan_estimator
axes: [channels, items, looks, az, el]
profiles:
  small: {shape: [4, 64, 1, 21, 11]}
  medium: {shape: [8, 256, 3, 41, 21]}
  large: {shape: [16, 1024, 9, 61, 31]}
live_ports: [array_geometry, az_coordinates, el_coordinates, array_taper, peak_interpolation]
recipe:
  operator_type: radar.BeamscanEstimatorOp.float
  inputs:
    - {port: snapshot, shape: [items, channels, looks], dtype: complex64, memory: device, generator: iq_cube}
  constructor: {extents: {max_items: items, max_snapshots: looks, max_az: az, max_el: el}}
  params:
    array_geometry: {factory: ula_geometry, spacing_wavelengths: 0.5, wavelength: 1.0}
    az_coordinates: {factory: linspace, start: -0.5, stop: 0.5, count: az}
    el_coordinates: {factory: linspace, start: -0.3, stop: 0.3, count: el}
    array_taper: {type: none}
    peak_interpolation: none
  outputs: {timed: aoa_estimates, drain: [angle_spectrum], unwired: [], queue_depth: 8, optional_tensor_outputs: [angle_spectrum]}
  live:
    array_geometry: {physical_port: array_geometry, codec: ula_geometry_patch}
    az_coordinates: {physical_port: az_coordinates, codec: shifted_linspace}
    el_coordinates: {physical_port: el_coordinates, codec: shifted_linspace}
    array_taper: {physical_port: array_taper, codec: window_spec}
    peak_interpolation: {physical_port: peak_interpolation, codec: enum}
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {}}
  - {id: tapered-medium, profile: medium, scopes: [limited], parameters: {array_taper: {type: hann}}}
  - {id: tapered-large, profile: large, scopes: [moderate], parameters: {array_taper: {type: hann}}}
  - {id: "geometry-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: array_geometry, value: {spacing_wavelengths: 0.45}}}
  - {id: "az-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: az_coordinates, value: {shift: 0.05}}}
  - {id: "el-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {}, override: {port: el_coordinates, value: {shift: 0.05}}}
  - {id: "taper-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: array_taper, value: {type: hann}}}
  - {id: "peak-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {}, override: {port: peak_interpolation, value: parabolic}}
  - {id: tapered-peak-medium, profile: medium, scopes: [thorough], parameters: {array_taper: {type: hann}}, override: {port: peak_interpolation, value: parabolic}}
  - id: geometry-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: array_geometry
      value:
        spacing_wavelengths: 0.45
      cache: cached
  - id: az-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: az_coordinates
      value:
        shift: 0.05
      cache: cached
  - id: el-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: el_coordinates
      value:
        shift: 0.05
      cache: cached
  - id: taper-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: array_taper
      value:
        type: hann
      cache: cached
  - id: peak-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: peak_interpolation
      value: parabolic
      cache: cached
  - id: tapered-peak-medium-cached
    profile: medium
    scopes:
    - thorough
    parameters:
      array_taper:
        type: hann
    override:
      port: peak_interpolation
      value: parabolic
      cache: cached
  - id: optional-minimal-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    output_mode: minimal
