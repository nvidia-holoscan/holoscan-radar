version: 2
operator: subarray_selection
axes: [items, channels, snapshots]
profiles:
  small: {shape: [64, 4, 2]}
  medium: {shape: [256, 8, 4]}
  large: {shape: [1024, 16, 8]}
live_ports: [array_geometry, subarray]
recipe:
  operator_type: radar.SubarraySelectionOp.float
  inputs:
    - {port: is_valid, shape: [items, snapshots], dtype: bool, memory: device, generator: valid_mask}
    - {port: snapshot, shape: [items, channels, snapshots], dtype: complex64, memory: device, generator: iq_cube}
  fixtures: {with_mask: 0, mask_dtype: 0}
  constructor: {extents: {max_items: items, max_subarray_channels: channels, max_snapshots: snapshots}}
  params:
    array_geometry: {factory: holey_ula, wavelength: 1.0}
    min_subarray_size: 2
  outputs: {timed: snapshot_out, drain: [array_geometry], drain_codecs: {array_geometry: array_geometry}, unwired: [is_valid_out], optional_tensor_outputs: [is_valid_out]}
  live:
    array_geometry: {physical_port: array_geometry_in, codec: holey_ula_patch}
    subarray: {physical_port: subarray, codec: contiguous_subarray}
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {}}
  - {id: minimum-medium, profile: medium, scopes: [limited], parameters: {min_subarray_size: 4}}
  - {id: "array_geometry-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: array_geometry, value: {wavelength: 0.9}}}
  - {id: "subarray-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {}, override: {port: subarray, value: contiguous}}
  - {id: min-geometry-medium, profile: medium, scopes: [thorough], parameters: {min_subarray_size: 4}, override: {port: array_geometry, value: {wavelength: 0.9}}}
  - id: array_geometry-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: array_geometry
      value:
        wavelength: 0.9
      cache: cached
  - id: subarray-{profile}-cached
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    override:
      port: subarray
      value: contiguous
      cache: cached
  - id: min-geometry-medium-cached
    profile: medium
    scopes:
    - thorough
    parameters:
      min_subarray_size: 4
    override:
      port: array_geometry
      value:
        wavelength: 0.9
      cache: cached
  - id: optional-all-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    output_mode: all
  - id: mask-bool-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 0
    output_mode: all
  - id: mask-bool-geometry-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 0
    output_mode: all
    override:
      port: array_geometry
      value:
        wavelength: 1.2
  - id: mask-bool-subarray-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 0
    output_mode: all
    override:
      port: subarray
      value: contiguous
  - id: mask-uint8-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 1
    output_mode: all
  - id: mask-uint8-geometry-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 1
    output_mode: all
    override:
      port: array_geometry
      value:
        wavelength: 1.2
  - id: mask-uint8-subarray-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    fixture:
      with_mask: 1
      mask_dtype: 1
    output_mode: all
    override:
      port: subarray
      value: contiguous
  - id: optional-minimal-{profile}
    profiles:
    - small
    - medium
    - large
    scopes:
    - thorough
    parameters: {}
    output_mode: minimal
