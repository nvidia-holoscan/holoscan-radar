version: 2
operator: phase_shift_beamformer
profiles:
  small:
    shape:
    - 4
    - 17
    - 1
    - 16
    - 32
  medium:
    shape:
    - 8
    - 31
    - 1
    - 32
    - 64
  large:
    shape:
    - 16
    - 41
    - 11
    - 32
    - 128
live_ports:
- array_geometry
- az_coordinates
- el_coordinates
- array_taper
cases:
- id: baseline-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - minimal
  parameters: {}
- id: tapered-medium
  profile: medium
  scopes:
  - limited
  parameters:
    array_taper:
      type: hann
- id: geometry-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
- id: az-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: az_coordinates
    value:
      shift: 0.05
- id: el-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  parameters: {}
  override:
    port: el_coordinates
    value:
      shift: 0.05
- id: taper-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - overrides
  - moderate
  parameters: {}
  override:
    port: array_taper
    value:
      type: hann
- id: tapered-geometry-medium
  profile: medium
  scopes:
  - thorough
  parameters:
    array_taper:
      type: hann
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
- id: geometry-{profile}-cached
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
    cache: cached
- id: az-{profile}-cached
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  override:
    port: az_coordinates
    value:
      shift: 0.05
    cache: cached
- id: el-{profile}-cached
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  override:
    port: el_coordinates
    value:
      shift: 0.05
    cache: cached
- id: taper-{profile}-cached
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  override:
    port: array_taper
    value:
      type: hann
    cache: cached
- id: tapered-geometry-medium-cached
  profile: medium
  scopes:
  - thorough
  parameters:
    array_taper:
      type: hann
  override:
    port: array_geometry
    value:
      spacing_wavelengths: 0.45
    cache: cached
- id: optional-all-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  output_mode: all
- id: optional-minimal-{profile}
  profiles:
  - small
  - medium
  - large
  scopes:
  - thorough
  parameters: {}
  output_mode: minimal
axes:
- channels
- az
- el
- doppler
- range
recipe:
  operator_type: radar.PhaseShiftBeamformerOp.float
  inputs:
  - port: rd_maps
    shape:
    - channels
    - doppler
    - range
    dtype: complex64
    memory: device
    generator: iq_cube
  constructor:
    extents:
      max_az: az
      max_el: el
      max_doppler_bins: doppler
      max_range_bins: range
  params:
    array_geometry:
      factory: ula_geometry
      spacing_wavelengths: 0.5
      wavelength: 1.0
    angle_convention:
      preset: radar_boresight
    az_coordinates:
      factory: linspace
      count: az
      start: -0.5
      stop: 0.5
    el_coordinates:
      factory: linspace
      count: el
      start: -0.3
      stop: 0.3
    array_taper:
      type: none
  outputs:
    timed: rda_cube
    drain: []
    unwired:
    - az_grid
    - el_grid
    queue_depth: 8
    optional_tensor_outputs: [az_grid, el_grid]
  live:
    array_geometry:
      physical_port: array_geometry
      codec: ula_geometry_patch
    az_coordinates:
      physical_port: az_coordinates
      codec: shifted_linspace
    el_coordinates:
      physical_port: el_coordinates
      codec: shifted_linspace
    array_taper:
      physical_port: array_taper
      codec: window_spec
