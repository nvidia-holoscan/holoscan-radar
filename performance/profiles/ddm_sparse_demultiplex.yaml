version: 1
operator: ddm_sparse_demultiplex
profiles:
  small: {shape: [2, 4, 64, 256, 16]}
  medium: {shape: [4, 8, 256, 512, 256]}
  large: {shape: [4, 16, 512, 1024, 1024]}
live_ports: [wavelength, snapshot_window]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {snapshot_window: [0, 0], overlap_policy: keep_all}}
  - {id: neighborhood-medium, profile: medium, scopes: [limited], parameters: {snapshot_window: [1, 1], overlap_policy: keep_all}}
  - {id: dedup-medium, profile: medium, scopes: [limited], parameters: {snapshot_window: [0, 0], overlap_policy: dedup}}
  - {id: "wavelength-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {snapshot_window: [0, 0], overlap_policy: keep_all}, override: {port: wavelength, value: 0.0041}}
  - {id: "window-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {snapshot_window: [0, 0], overlap_policy: keep_all}, override: {port: snapshot_window, value: [1, 1]}}
  - {id: average-window-medium, profile: medium, scopes: [thorough], parameters: {snapshot_window: [1, 1], overlap_policy: average}, override: {port: snapshot_window, value: [2, 2]}}
