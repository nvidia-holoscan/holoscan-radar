version: 1
operator: cfar_detector
profiles:
  small: {shape: [64, 256]}
  medium: {shape: [128, 512]}
  large: {shape: [256, 512]}
live_ports: [os_rank, guard_cells, training_cells, pfa, alpha_lut, threshold_scale, nci_axes, max_detections]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}}
  - {id: backend-go-medium, profile: medium, scopes: [limited], parameters: {variant: GO, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}}
  - {id: backend-so-medium, profile: medium, scopes: [limited], parameters: {variant: SO, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}}
  - {id: backend-os-medium, profile: medium, scopes: [limited], parameters: {variant: OS, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}}
  - {id: footprint-mid-medium, profile: medium, scopes: [limited], parameters: {variant: CA, footprint: mid, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}}
  - {id: peak-medium, profile: medium, scopes: [moderate], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: range_doppler, threshold_scale: 1.0}}
  - {id: "os_rank-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {variant: OS, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: os_rank, value: "lower"}}
  - {id: "guard_cells-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: guard_cells, value: "zero"}}
  - {id: "training_cells-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: training_cells, value: "three"}}
  - {id: "pfa-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: pfa, value: "0.001"}}
  - {id: "alpha_lut-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: alpha_lut, value: "scaled"}}
  - {id: "threshold_scale-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: threshold_scale, value: "1.1"}}
  - {id: "nci_axes-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {variant: CA, footprint: small, channels: 4, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: nci_axes, value: "channel"}}
  - {id: "max_detections-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {variant: CA, footprint: small, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: max_detections, value: "100"}}
  - {id: footprint-pfa-medium, profile: medium, scopes: [thorough], parameters: {variant: CA, footprint: mid, channels: 1, pfa: 0.000001, peak_mode: none, threshold_scale: 1.0}, override: {port: pfa, value: "0.001"}}
