version: 1
operator: beamscan_estimator
profiles:
  small: {shape: [4, 64, 1, 21, 11]}
  medium: {shape: [8, 256, 3, 41, 21]}
  large: {shape: [16, 1024, 9, 61, 31]}
live_ports: [array_geometry, az_coordinates, el_coordinates, array_taper, peak_interpolation]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {array_taper: none}}
  - {id: tapered-medium, profile: medium, scopes: [limited], parameters: {array_taper: hann}}
  - {id: tapered-large, profile: large, scopes: [moderate], parameters: {array_taper: hann}}
  - {id: "geometry-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {array_taper: none}, override: {port: array_geometry, value: spacing_045}}
  - {id: "az-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {array_taper: none}, override: {port: az_coordinates, value: shift_005}}
  - {id: "el-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {array_taper: none}, override: {port: el_coordinates, value: shift_005}}
  - {id: "taper-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {array_taper: none}, override: {port: array_taper, value: hann}}
  - {id: "peak-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {array_taper: none}, override: {port: peak_interpolation, value: parabolic}}
  - {id: tapered-peak-medium, profile: medium, scopes: [thorough], parameters: {array_taper: hann}, override: {port: peak_interpolation, value: parabolic}}
