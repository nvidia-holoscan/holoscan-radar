version: 1
operator: tdm_dense_compensation
profiles:
  small: {shape: [2, 4, 32, 128]}
  medium: {shape: [4, 16, 128, 512]}
  large: {shape: [8, 32, 256, 1024]}
live_ports: [waveform]
cases:
  - {id: baseline-small, profile: small, scopes: [minimal], parameters: {pri: 0.000025}}
  - {id: baseline-medium, profile: medium, scopes: [minimal], parameters: {pri: 0.000025}}
  - {id: baseline-large, profile: large, scopes: [minimal], parameters: {pri: 0.000025}}
  - {id: longer-pri-medium, profile: medium, scopes: [limited], parameters: {pri: 0.00003}}
  - {id: waveform-small, profile: small, scopes: [overrides, moderate], parameters: {pri: 0.000025}, override: {port: waveform, value: 0.00003}}
  - {id: waveform-medium, profile: medium, scopes: [overrides, moderate], parameters: {pri: 0.000025}, override: {port: waveform, value: 0.00003}}
  - {id: waveform-large, profile: large, scopes: [overrides, moderate], parameters: {pri: 0.000025}, override: {port: waveform, value: 0.00003}}
  - {id: alternate-waveform-medium, profile: medium, scopes: [thorough], parameters: {pri: 0.000025}, override: {port: waveform, value: 0.0000275}}
