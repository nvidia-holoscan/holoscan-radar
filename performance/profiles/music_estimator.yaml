version: 1
operator: music_estimator
profiles:
  small: {shape: [4, 64, 16, 21, 11]}
  medium: {shape: [8, 128, 32, 41, 21]}
  large: {shape: [16, 256, 48, 61, 31]}
live_ports: [array_geometry, az_coordinates, el_coordinates, spatial_smoothing, num_sources, source_count_pfa, max_sources]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {num_sources: auto}}
  - {id: parameter-medium, profile: medium, scopes: [limited], parameters: {num_sources: 2}}
  - {id: parameter-large, profile: large, scopes: [moderate], parameters: {num_sources: 2}}
  - {id: "array-geometry-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {num_sources: auto}, override: {port: array_geometry, value: "spacing_045"}}
  - {id: "az-coordinates-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {num_sources: auto}, override: {port: az_coordinates, value: "shift_005"}}
  - {id: "el-coordinates-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {num_sources: auto}, override: {port: el_coordinates, value: "shift_005"}}
  - {id: "spatial-smoothing-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {num_sources: auto}, override: {port: spatial_smoothing, value: "two"}}
  - {id: "num-sources-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {num_sources: auto}, override: {port: num_sources, value: "2"}}
  - {id: "source-count-pfa-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {num_sources: auto}, override: {port: source_count_pfa, value: "0.001"}}
  - {id: "max-sources-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {num_sources: auto}, override: {port: max_sources, value: "3"}}
  - {id: transition-medium, profile: medium, scopes: [thorough], parameters: {num_sources: 2}, override: {port: array_geometry, value: spacing_045}}
