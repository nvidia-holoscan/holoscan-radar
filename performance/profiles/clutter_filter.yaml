version: 1
operator: clutter_filter
profiles:
  small: {shape: [16, 128]}
  medium: {shape: [64, 512]}
  large: {shape: [128, 1024]}
live_ports: [method, doppler_window]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {method: mean_subtraction, doppler_window: none}}
  - {id: single-delay-medium, profile: medium, scopes: [limited], parameters: {method: single_delay, doppler_window: none}}
  - {id: double-delay-medium, profile: medium, scopes: [limited], parameters: {method: double_delay, doppler_window: none}}
  - {id: passthrough-medium, profile: medium, scopes: [limited], parameters: {method: none, doppler_window: none}}
  - {id: "method-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {method: mean_subtraction, doppler_window: none}, override: {port: method, value: single_delay}}
  - {id: "window-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {method: mean_subtraction, doppler_window: none}, override: {port: doppler_window, value: hamming}}
  - {id: four-channels-medium, profile: medium, scopes: [moderate], parameters: {method: mean_subtraction, doppler_window: none, channels: 4}}
  - {id: hann-medium, profile: medium, scopes: [moderate], parameters: {method: mean_subtraction, doppler_window: hann}}
  - {id: sixteen-channels-large, profile: large, scopes: [thorough], parameters: {method: mean_subtraction, doppler_window: none, channels: 16}}
