version: 1
operator: mvdr_estimator
profiles:
  small: {shape: [4, 64, 16, 21, 11]}
  medium: {shape: [8, 128, 32, 41, 21]}
  large: {shape: [16, 256, 48, 61, 31]}
live_ports: [array_geometry, az_coordinates, el_coordinates, spatial_smoothing, diagonal_loading, max_sources]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {diagonal_loading: -1.0, max_sources: 1}}
  - {id: parameter-medium, profile: medium, scopes: [limited], parameters: {diagonal_loading: 0.01, max_sources: 4}}
  - {id: parameter-large, profile: large, scopes: [moderate], parameters: {diagonal_loading: 0.01, max_sources: 4}}
  - {id: "array-geometry-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: array_geometry, value: "spacing_045"}}
  - {id: "az-coordinates-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: az_coordinates, value: "shift_005"}}
  - {id: "el-coordinates-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: el_coordinates, value: "shift_005"}}
  - {id: "spatial-smoothing-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: spatial_smoothing, value: "two"}}
  - {id: "diagonal-loading-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: diagonal_loading, value: "0.01"}}
  - {id: "max-sources-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {diagonal_loading: -1.0, max_sources: 1}, override: {port: max_sources, value: "3"}}
  - {id: transition-medium, profile: medium, scopes: [thorough], parameters: {diagonal_loading: 0.01, max_sources: 4}, override: {port: array_geometry, value: spacing_045}}
