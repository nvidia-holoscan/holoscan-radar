version: 1
operator: fmcw_range_processor
profiles:
  small: {shape: [16, 128]}
  medium: {shape: [64, 512]}
  large: {shape: [128, 1024]}
live_ports: [range_window, apply_dechirp, waveform, fft_norm, nfft]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {range_window: none, fft_norm: backward}}
  - {id: hann-medium, profile: medium, scopes: [limited], parameters: {range_window: hann, fft_norm: backward}}
  - {id: four-channels-medium, profile: medium, scopes: [limited], parameters: {range_window: none, fft_norm: backward, channels: 4}}
  - {id: padded-medium, profile: medium, scopes: [limited], parameters: {range_window: none, fft_norm: backward, nfft: 1024}}
  - {id: "window-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {range_window: none, fft_norm: backward}, override: {port: range_window, value: hann}}
  - {id: "dechirp-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {range_window: none, fft_norm: backward}, override: {port: apply_dechirp, value: true}}
  - {id: "waveform-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {range_window: none, fft_norm: backward}, override: {port: waveform, value: 0.00003}}
  - {id: "norm-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {range_window: none, fft_norm: backward}, override: {port: fft_norm, value: ortho}}
  - {id: "nfft-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {range_window: none, fft_norm: backward}, override: {port: nfft, value: double, cache: unseen}}
  - {id: dechirp-hann-medium, profile: medium, scopes: [moderate], parameters: {range_window: hann, fft_norm: backward, apply_dechirp: true}}
  - {id: hamming-window-medium, profile: medium, scopes: [thorough], parameters: {range_window: hann, fft_norm: ortho}, override: {port: range_window, value: hamming}}
  - {id: nfft-cached-medium, profile: medium, scopes: [thorough], parameters: {range_window: none, fft_norm: backward}, override: {port: nfft, value: double, cache: cached}}
