version: 1
operator: fmcw_range_doppler_processor
profiles:
  small: {shape: [16, 128]}
  medium: {shape: [64, 512]}
  large: {shape: [128, 1024]}
live_ports: [range_window, doppler_window, apply_dechirp, clutter_filter, waveform, fft_norm, center_zero_doppler, nfft_range, nfft_doppler]
cases:
  - {id: baseline-small, profile: small, scopes: [minimal], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: baseline-medium, profile: medium, scopes: [minimal], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: baseline-large, profile: large, scopes: [minimal], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: mean-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: mean_subtraction, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: single-delay-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: single_delay, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: hann-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: none, range_window: hann, doppler_window: hann, fft_norm: backward}}
  - {id: four-channels-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward, channels: 4}}
  - {id: range-window-small, profile: small, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: range_window, value: hann}}
  - {id: range-window-medium, profile: medium, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: range_window, value: hann}}
  - {id: range-window-large, profile: large, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: range_window, value: hann}}
  - {id: doppler-window-small, profile: small, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: doppler_window, value: hann}}
  - {id: doppler-window-medium, profile: medium, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: doppler_window, value: hann}}
  - {id: doppler-window-large, profile: large, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: doppler_window, value: hann}}
  - {id: dechirp-small, profile: small, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: apply_dechirp, value: true}}
  - {id: dechirp-medium, profile: medium, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: apply_dechirp, value: true}}
  - {id: dechirp-large, profile: large, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: apply_dechirp, value: true}}
  - {id: clutter-small, profile: small, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: clutter_filter, value: mean_subtraction}}
  - {id: clutter-medium, profile: medium, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: clutter_filter, value: mean_subtraction}}
  - {id: clutter-large, profile: large, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: clutter_filter, value: mean_subtraction}}
