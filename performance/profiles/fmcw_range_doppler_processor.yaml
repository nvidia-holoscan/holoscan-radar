version: 1
operator: fmcw_range_doppler_processor
profiles:
  small: {shape: [16, 128]}
  medium: {shape: [64, 512]}
  large: {shape: [128, 1024]}
live_ports: [range_window, doppler_window, apply_dechirp, clutter_filter, waveform, fft_norm, center_zero_doppler, nfft_range, nfft_doppler]
cases:
  - {id: "baseline-{profile}", profiles: [small, medium, large], scopes: [minimal], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: mean-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: mean_subtraction, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: single-delay-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: single_delay, range_window: none, doppler_window: none, fft_norm: backward}}
  - {id: hann-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: none, range_window: hann, doppler_window: hann, fft_norm: backward}}
  - {id: four-channels-medium, profile: medium, scopes: [limited], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward, channels: 4}}
  - {id: "range-window-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: range_window, value: hann}}
  - {id: "doppler-window-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: doppler_window, value: hann}}
  - {id: "dechirp-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: apply_dechirp, value: true}}
  - {id: "clutter-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: clutter_filter, value: mean_subtraction}}
  - {id: "waveform-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: waveform, value: 0.00003}}
  - {id: "norm-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: fft_norm, value: ortho}}
  - {id: "shift-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: center_zero_doppler, value: false}}
  - {id: "nfft-range-{profile}", profiles: [small, medium, large], scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_range, value: double}}
  - {id: "nfft-doppler-{profile}", profiles: [small, medium, large], scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_doppler, value: double}}
  - {id: dechirp-hann-medium, profile: medium, scopes: [moderate], parameters: {clutter_filter: mean_subtraction, range_window: hann, doppler_window: hann, fft_norm: backward, apply_dechirp: true}}
  - {id: delay-hamming-large, profile: large, scopes: [thorough], parameters: {clutter_filter: single_delay, range_window: hann, doppler_window: hamming, fft_norm: ortho}}
