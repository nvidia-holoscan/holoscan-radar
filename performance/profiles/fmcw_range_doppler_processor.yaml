  - {id: shift-medium, profile: medium, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: center_zero_doppler, value: false}}
  - {id: shift-large, profile: large, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: center_zero_doppler, value: false}}
  - {id: nfft-range-small, profile: small, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_range, value: double}}
  - {id: nfft-range-medium, profile: medium, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_range, value: double}}
  - {id: nfft-range-large, profile: large, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_range, value: double}}
  - {id: nfft-doppler-small, profile: small, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_doppler, value: double}}
  - {id: nfft-doppler-medium, profile: medium, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_doppler, value: double}}
  - {id: nfft-doppler-large, profile: large, scopes: [overrides, moderate], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: nfft_doppler, value: double}}
  - {id: dechirp-hann-medium, profile: medium, scopes: [moderate], parameters: {clutter_filter: mean_subtraction, range_window: hann, doppler_window: hann, fft_norm: backward, apply_dechirp: true}}
