  - {id: waveform-medium, profile: medium, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: waveform, value: 0.00003}}
  - {id: waveform-large, profile: large, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: waveform, value: 0.00003}}
  - {id: norm-small, profile: small, scopes: [overrides], parameters: {clutter_filter: none, range_window: none, doppler_window: none, fft_norm: backward}, override: {port: fft_norm, value: ortho}}
