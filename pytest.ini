[pytest]
testpaths = tests/python

addopts = --tb=short -v -p no:cacheprovider -m "not statistical"

log_cli = true
log_cli_level = INFO
log_format = %(levelname)s %(name)s:%(lineno)d — %(message)s

markers =
    requires_gpu: test runs a live Holoscan pipeline and needs a GPU
    statistical: Monte-Carlo / slow calibration (mirror C++ -L statistical)

timeout = 300

# PYTHONPATH is resolved by conftest.py via the HOLOSCAN_RADAR_BUILD_DIR
# environment variable (injected by CTest automatically).
# Manual invocation: HOLOSCAN_RADAR_BUILD_DIR=build pytest
