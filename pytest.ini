[pytest]
testpaths = tests/provider

addopts = --tb=short -v -p no:cacheprovider

log_cli = true
log_cli_level = INFO
log_format = %(levelname)s %(name)s:%(lineno)d — %(message)s

markers =
    requires_gpu: test runs a live Holoscan pipeline and needs a GPU

timeout = 300

# CTest adds build/python/lib to PYTHONPATH. For manual runs, add the same
# directory alongside the pinned SDK Python site-packages before invoking pytest.
